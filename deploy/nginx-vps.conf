# EduSyncra — production nginx for a Contabo/Ubuntu VPS (nginx -> gunicorn).
#
# This is the SERVER config (TLS, gzip, immutable static caching, edge security
# headers, rate limiting). It complements deploy/nginx-posyhub.conf, which is the
# minimal Termux/Cloudflare-tunnel proxy. Use THIS one on the dedicated VPS.
#
# Install:
#   sudo cp deploy/nginx-vps.conf /etc/nginx/sites-available/edusyncra
#   sudo ln -sf /etc/nginx/sites-available/edusyncra /etc/nginx/sites-enabled/edusyncra
#   sudo rm -f /etc/nginx/sites-enabled/default
#   # get certs (wildcard needed for *.edusyncra.site multi-tenant subdomains):
#   sudo certbot --nginx -d edusyncra.site -d '*.edusyncra.site'   # DNS-01 for wildcard
#   sudo nginx -t && sudo systemctl reload nginx
#
# App side (.env): GUNICORN_BIND=127.0.0.1:5000  TRUST_PROXY=1  FORCE_HTTPS=1
#
# Rate-limit zones (defined once, in the http{} context). If your distro's
# nginx.conf already has a conf.d include, put these two lines there instead.
limit_req_zone  $binary_remote_addr  zone=login:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr  zone=general:10m rate=30r/s;

# NB: gzip lives INSIDE the server block below, not here. Ubuntu's default
# nginx.conf already sets `gzip on;` at the http level, so a second `gzip on;`
# in this (also http-level) included file is a duplicate-directive error. Setting
# it in the server block overrides cleanly instead of duplicating.

upstream edusyncra_app {
    server 127.0.0.1:5000 fail_timeout=0;
    # No upstream keepalive: it requires EVERY proxy location to also set
    # `proxy_http_version 1.1` + `proxy_set_header Connection ""`, or reused
    # connections get HTTP/1.0 framing mismatches that surface as spurious 404s
    # on some requests (it bit /login, /register, /exam/login). The upstream is
    # localhost gunicorn, where connection setup is essentially free, so dropping
    # keepalive costs nothing and makes every location correct by construction.
}

# ── HTTP → HTTPS redirect (keep :80 only for the ACME challenge + redirect) ────
server {
    listen 80;
    listen [::]:80;
    server_name edusyncra.site *.edusyncra.site;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edusyncra.site *.edusyncra.site;

    # TLS (certbot fills these in; kept explicit so the intent is visible).
    ssl_certificate     /etc/letsencrypt/live/edusyncra.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edusyncra.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip text responses (JSON APIs, HTML, JS/CSS). In the server block so it
    # overrides the http-level default without a duplicate-directive error.
    # Images/PDFs are already compressed, so they're intentionally excluded.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/javascript application/xml image/svg+xml;

    # Uploads: match Flask MAX_CONTENT_LENGTH (16 MB) so nginx rejects oversize
    # bodies at the edge instead of tying up a gunicorn thread.
    client_max_body_size 16m;

    # Edge security headers (the app also sets its own; these are belt-and-braces
    # and cover static responses that never reach Flask).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS: only after you've confirmed HTTPS works on every subdomain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets straight from disk — never touches gunicorn. Content-versioned
    # bundles (?v=<mtime>) are safe to cache hard; nginx honours the app's
    # Cache-Control for them, and we set a sane default here too.
    location /static/ {
        alias /opt/edusyncra/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        # Long-cache the hashed React/CSS bundles specifically.
        location ~* \.(?:js|css|woff2?|png|jpe?g|svg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }
    }

    # Service worker must revalidate (it controls the whole app shell).
    location = /sw.js { proxy_pass http://edusyncra_app; proxy_set_header Host $host; add_header Cache-Control "no-cache"; }

    # Health check for uptime probes / load balancers.
    location = /healthz { proxy_pass http://edusyncra_app; access_log off; }

    # Login endpoints: throttle brute-force at the edge (burst absorbs real bursts;
    # nodelay serves the burst immediately, then enforces the rate).
    location ~ ^/(login|exam/login|auth/login|register) {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://edusyncra_app;
        include /etc/nginx/proxy_params;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # General flood ceiling; burst is generous so CBT autosave/heartbeat
        # traffic from real cohorts is never throttled.
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://edusyncra_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";           # enable upstream keepalive
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long ops (OCR, PDF, report/timetable generation) run up to ~120s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
