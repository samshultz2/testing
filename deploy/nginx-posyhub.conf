# PosyHub reverse proxy (nginx -> gunicorn).
#
# Works on Termux/proot now and on a Linux server later. Place gunicorn behind
# this by setting in .env:
#     GUNICORN_BIND=127.0.0.1:5000
#     TRUST_PROXY=1
#
# Termux/proot (Ubuntu) install:
#     apt install -y nginx
#     cp deploy/nginx-posyhub.conf /etc/nginx/sites-available/posyhub
#     ln -sf /etc/nginx/sites-available/posyhub /etc/nginx/sites-enabled/posyhub
#     rm -f /etc/nginx/sites-enabled/default
#     # edit the 'root'/'alias' path below to your repo location, then:
#     nginx -t && nginx        # start; reload later with: nginx -s reload
#
# Reach it from another device on the same Wi-Fi at  http://<phone-LAN-ip>/

server {
    listen 80;
    listen [::]:80;
    server_name _;                     # any host; set a domain on a real server

    client_max_body_size 16m;          # matches MAX_CONTENT_LENGTH (uploads)

    # Serve static assets directly for speed. Update this path to where the
    # repo lives on your device, e.g.
    #   /root/storage_fix/shared/Download/hobby/testing/static
    location /static/ {
        alias /ABSOLUTE/PATH/TO/testing/static/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # long ops: OCR, PDF, report generation
    }

    # Health check (used by uptime probes / load balancers).
    location = /healthz {
        proxy_pass http://127.0.0.1:5000/healthz;
        access_log off;
    }
}
