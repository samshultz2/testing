<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" fill="none" stroke="#64748b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
  <!-- Faint science doodles, tiled behind the student exam portal. -->
  <!-- benzene ring -->
  <g transform="translate(58 62)">
    <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13"/>
    <circle r="13"/>
    <line x1="0" y1="-26" x2="0" y2="-40"/><line x1="22.5" y1="13" x2="34.6" y2="20"/>
    <text x="-6" y="-44" font-size="11" stroke="none" fill="#64748b">OH</text>
  </g>
  <!-- atom -->
  <g transform="translate(330 70)">
    <ellipse rx="36" ry="12"/>
    <ellipse rx="36" ry="12" transform="rotate(60)"/>
    <ellipse rx="36" ry="12" transform="rotate(-60)"/>
    <circle r="4" fill="#64748b" stroke="none"/>
    <circle cx="36" cy="0" r="2.4" fill="#64748b" stroke="none"/>
  </g>
  <!-- Sierpinski triangle (fractal) -->
  <g transform="translate(176 130)">
    <polygon points="0,-44 38,22 -38,22"/>
    <polygon points="0,22 -19,-11 19,-11"/>
    <polygon points="-19,22 -28.5,5.5 -9.5,5.5"/>
    <polygon points="19,22 9.5,5.5 28.5,5.5"/>
    <polygon points="0,-11 -9.5,-27.5 9.5,-27.5"/>
  </g>
  <!-- sine wave with axis -->
  <g transform="translate(250 190)">
    <line x1="0" y1="0" x2="130" y2="0" stroke-dasharray="3 4"/>
    <path d="M0 0 C 16 -30, 32 -30, 48 0 S 80 30, 96 0 S 120 -24, 130 -12"/>
  </g>
  <!-- golden spiral in squares -->
  <g transform="translate(40 168)">
    <rect width="89" height="55"/>
    <line x1="55" y1="0" x2="55" y2="55"/>
    <line x1="55" y1="21" x2="89" y2="21"/>
    <path d="M55 55 A55 55 0 0 1 0 0 M55 0 A34 34 0 0 1 89 21 A21 21 0 0 1 68 34"/>
  </g>
  <!-- cube wireframe -->
  <g transform="translate(350 290)">
    <rect x="-24" y="-14" width="34" height="34"/>
    <rect x="-12" y="-26" width="34" height="34"/>
    <line x1="-24" y1="-14" x2="-12" y2="-26"/><line x1="10" y1="-14" x2="22" y2="-26"/>
    <line x1="-24" y1="20" x2="-12" y2="8"/><line x1="10" y1="20" x2="22" y2="8"/>
  </g>
  <!-- right triangle with angle -->
  <g transform="translate(150 300)">
    <polygon points="0,0 70,0 0,-48"/>
    <path d="M0 -10 H10 V0"/>
    <path d="M56 0 A14 14 0 0 0 58.5 -8"/>
    <text x="40" y="-6" font-size="12" stroke="none" fill="#64748b">θ</text>
  </g>
  <!-- light ray through a lens -->
  <g transform="translate(60 330)">
    <path d="M0 -26 Q 10 0 0 26 Q -10 0 0 -26 Z"/>
    <line x1="-50" y1="-14" x2="0" y2="-14"/><line x1="0" y1="-14" x2="44" y2="14"/>
    <line x1="-50" y1="14" x2="0" y2="14"/><line x1="0" y1="14" x2="44" y2="-14"/>
  </g>
  <!-- DNA-ish double helix -->
  <g transform="translate(262 330)">
    <path d="M0 0 C 12 -16, 24 -16, 36 0 S 60 16, 72 0"/>
    <path d="M0 0 C 12 16, 24 16, 36 0 S 60 -16, 72 0"/>
    <line x1="9" y1="-9" x2="9" y2="9"/><line x1="27" y1="-9" x2="27" y2="9"/>
    <line x1="45" y1="-9" x2="45" y2="9"/><line x1="63" y1="-9" x2="63" y2="9"/>
  </g>
  <!-- formulas -->
  <g stroke="none" fill="#64748b">
    <text x="196" y="44" font-size="17">E = mc²</text>
    <text x="96" y="262" font-size="15">H₂O</text>
    <text x="300" y="250" font-size="22">π</text>
    <text x="214" y="236" font-size="15">Σ x²</text>
    <text x="20" y="404" font-size="14">F = ma</text>
    <text x="300" y="400" font-size="14">a² + b² = c²</text>
    <text x="118" y="398" font-size="15">∫ f(x) dx</text>
    <text x="378" y="160" font-size="15">√2</text>
  </g>
  <!-- dots -->
  <g fill="#64748b" stroke="none">
    <circle cx="250" cy="96" r="1.6"/><circle cx="262" cy="104" r="1.6"/><circle cx="240" cy="110" r="1.6"/>
    <circle cx="118" cy="20" r="1.6"/><circle cx="400" cy="220" r="1.6"/><circle cx="22" cy="270" r="1.6"/>
  </g>
</svg>
