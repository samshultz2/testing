<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-label="PosyHub — Student Manager">
  <defs>
    <linearGradient id="lg-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".55" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="lg-petal" cx="50%" cy="34%" r="68%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdeede"/>
    </radialGradient>
    <radialGradient id="lg-hub" cx="40%" cy="36%" r="72%">
      <stop offset="0" stop-color="#fff7d6"/><stop offset=".5" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- mark, scaled 0.5 into a 256 box -->
  <g transform="translate(28,32) scale(0.5)">
    <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#lg-badge)"/>
    <g fill="#fb7185">
      <circle cx="325" cy="136" r="11"/><circle cx="394" cy="256" r="11"/><circle cx="325" cy="376" r="11"/>
      <circle cx="187" cy="376" r="11"/><circle cx="118" cy="256" r="11"/><circle cx="187" cy="136" r="11"/>
    </g>
    <g fill="url(#lg-petal)">
      <path d="M256 104 C306 158 308 214 256 256 C204 214 206 158 256 104 Z" transform="rotate(0 256 256)"/>
      <path d="M256 104 C306 158 308 214 256 256 C204 214 206 158 256 104 Z" transform="rotate(60 256 256)"/>
      <path d="M256 104 C306 158 308 214 256 256 C204 214 206 158 256 104 Z" transform="rotate(120 256 256)"/>
      <path d="M256 104 C306 158 308 214 256 256 C204 214 206 158 256 104 Z" transform="rotate(180 256 256)"/>
      <path d="M256 104 C306 158 308 214 256 256 C204 214 206 158 256 104 Z" transform="rotate(240 256 256)"/>
      <path d="M256 104 C306 158 308 214 256 256 C204 214 206 158 256 104 Z" transform="rotate(300 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="42" fill="url(#lg-hub)"/>
    <circle cx="243" cy="243" r="11" fill="#ffffff" opacity=".75"/>
  </g>

  <!-- wordmark -->
  <text x="312" y="172" font-family="'Poppins','Segoe UI',system-ui,sans-serif" font-size="118" font-weight="800" letter-spacing="-2">
    <tspan fill="#059669">Posy</tspan><tspan fill="#f59e0b">Hub</tspan>
  </text>
  <text x="316" y="232" font-family="'Poppins','Segoe UI',system-ui,sans-serif" font-size="44" font-weight="500" letter-spacing="6" fill="#64748b">STUDENT MANAGER</text>
</svg>
