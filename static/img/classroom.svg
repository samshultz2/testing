<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" width="440" height="340" role="img" aria-label="Nigerian students in class">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf1ff"/><stop offset="1" stop-color="#dfeaff"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15603f"/><stop offset="1" stop-color="#0f4d33"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="440" height="340" rx="0"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="440" height="340" fill="url(#bg)"/>
    <!-- soft light -->
    <circle cx="360" cy="70" r="120" fill="#ffffff" opacity=".35"/>
    <!-- chalkboard -->
    <rect x="66" y="34" width="308" height="150" rx="12" fill="#7c4a1e"/>
    <rect x="74" y="42" width="292" height="134" rx="8" fill="url(#board)"/>
    <!-- board content: growth chart + check -->
    <polyline points="104,150 140,126 176,134 212,100 248,110 292,74" fill="none" stroke="#7fe8bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="292" cy="74" r="6" fill="#bff5da"/>
    <g opacity=".9">
      <rect x="104" y="150" width="12" height="16" rx="2" fill="#3ee0ad"/>
      <rect x="126" y="140" width="12" height="26" rx="2" fill="#3ee0ad"/>
      <rect x="148" y="146" width="12" height="20" rx="2" fill="#3ee0ad"/>
    </g>
    <text x="300" y="70" font-family="'Plus Jakarta Sans',sans-serif" font-size="20" font-weight="800" fill="#ffe9a8">A+</text>
    <!-- desk -->
    <rect x="0" y="288" width="440" height="52" fill="#cdd9ee"/>
    <rect x="0" y="284" width="440" height="8" fill="#b9c8e6"/>

    <!-- STUDENT LEFT (navy uniform) -->
    <g transform="translate(120,210)">
      <path d="M-42,92 C-42,50 -22,34 0,34 C22,34 42,50 42,92 Z" fill="#1e3a8a"/>
      <rect x="-9" y="16" width="18" height="20" rx="7" fill="#8d5524"/>
      <circle cx="0" cy="0" r="26" fill="#8d5524"/>
      <path d="M-26,-4 C-26,-26 26,-26 26,-4 C18,-16 -18,-16 -26,-4 Z" fill="#2b1a0f"/>
      <circle cx="-9" cy="2" r="3" fill="#2b1a0f"/><circle cx="9" cy="2" r="3" fill="#2b1a0f"/>
      <path d="M-9,12 Q0,20 9,12" fill="none" stroke="#2b1a0f" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="-14" y="44" width="28" height="12" rx="3" fill="#ffffff" opacity=".9"/>
    </g>

    <!-- STUDENT CENTER (blue, graduation cap) -->
    <g transform="translate(220,196)">
      <path d="M-46,106 C-46,58 -24,40 0,40 C24,40 46,58 46,106 Z" fill="#2f6bff"/>
      <rect x="-10" y="18" width="20" height="24" rx="8" fill="#c68642"/>
      <circle cx="0" cy="0" r="29" fill="#c68642"/>
      <circle cx="-10" cy="2" r="3.2" fill="#2b1a0f"/><circle cx="10" cy="2" r="3.2" fill="#2b1a0f"/>
      <path d="M-11,13 Q0,23 11,13" fill="none" stroke="#2b1a0f" stroke-width="2.8" stroke-linecap="round"/>
      <!-- mortarboard -->
      <path d="M-30,-20 L0,-32 L30,-20 L0,-8 Z" fill="#12203f"/>
      <path d="M-18,-14 L-18,-2 C-18,4 18,4 18,-2 L18,-14" fill="#12203f"/>
      <line x1="24" y1="-24" x2="24" y2="-6" stroke="#f4a825" stroke-width="2.5"/>
      <circle cx="24" cy="-4" r="3" fill="#f4a825"/>
      <rect x="-16" y="48" width="32" height="13" rx="3" fill="#ffffff" opacity=".9"/>
    </g>

    <!-- STUDENT RIGHT (green uniform) -->
    <g transform="translate(322,214)">
      <path d="M-40,88 C-40,48 -20,32 0,32 C20,32 40,48 40,88 Z" fill="#16a34a"/>
      <rect x="-8" y="15" width="16" height="19" rx="6" fill="#5c3a21"/>
      <circle cx="0" cy="0" r="24" fill="#5c3a21"/>
      <path d="M-24,-2 C-22,-24 22,-24 24,-2 C14,-30 -14,-30 -24,-2 Z" fill="#160d06"/>
      <circle cx="-8" cy="2" r="2.8" fill="#160d06"/><circle cx="8" cy="2" r="2.8" fill="#160d06"/>
      <path d="M-8,11 Q0,18 8,11" fill="none" stroke="#160d06" stroke-width="2.3" stroke-linecap="round"/>
      <!-- book -->
      <rect x="-16" y="40" width="30" height="10" rx="2" fill="#ef9a10"/>
      <rect x="-16" y="40" width="15" height="10" rx="2" fill="#f4c04e"/>
    </g>
  </g>
</svg>
