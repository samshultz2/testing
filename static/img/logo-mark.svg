<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EduSyncra">
  <defs>
    <linearGradient id="es-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11433c"/>
      <stop offset="1" stop-color="#0e8a64"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#es-badge)"/>

  <!-- sync ring: two arcs, rounded caps -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round">
    <path d="M 294.8 400.9 A 150 150 0 0 1 149.9 149.9"/>
    <path d="M 217.2 111.1 A 150 150 0 0 1 362.1 362.1"/>
  </g>
  <!-- sync node (single accent) -->
  <circle cx="331" cy="385.9" r="17" fill="#f5b942"/>

  <!-- geometric E -->
  <g fill="#ffffff">
    <rect x="192" y="179" width="132" height="34" rx="17"/>
    <rect x="192" y="239" width="104" height="34" rx="17"/>
    <rect x="192" y="299" width="132" height="34" rx="17"/>
  </g>
</svg>
