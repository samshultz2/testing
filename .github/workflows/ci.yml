name: CI

on:
  push:
    branches: [ main, "claude/**" ]
  pull_request:

# Least privilege: the test/audit jobs only need to read the repo. Overrides the
# repository-default GITHUB_TOKEN scope so a compromised step can't write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA (tag in comment) so a moved/
      # re-tagged release can't inject code into CI.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tesseract (for OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-osd

      - name: Install dependencies (hash-verified lockfile)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Run tests
        env:
          POSYHUB_TESTING: "1"
        run: python -m pytest -q

  audit:
    # Fails the build if any pinned dependency has a known CVE. Keep this green
    # by bumping the offending pin in requirements.txt and re-locking.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Audit dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.lock --progress-spinner off
