<!doctype html>
<html lang="en" data-theme="{{ current_theme }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No-JS fallback: refresh straight to the Paystack checkout page. -->
  <meta http-equiv="refresh" content="0; url={{ url }}">
  <title>Redirecting to secure payment…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ bundle_url('css/marketing.css') }}">
  <style>
    body{min-height:100vh;display:grid;place-items:center;margin:0;font-family:'DM Sans',system-ui,sans-serif;
         background:var(--surface,#f7f8fa);color:var(--text-primary,#0f172a);padding:24px}
    .card{max-width:440px;text-align:center;background:#fff;border:1px solid #e9edf3;border-radius:18px;
          padding:34px 30px;box-shadow:0 12px 30px -18px rgba(15,23,42,.16)}
    .spin{width:40px;height:40px;margin:0 auto 18px;border:3px solid #e8f5f1;border-top-color:#0d6a4e;
          border-radius:50%;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    h1{font-family:'Space Grotesk','DM Sans',sans-serif;font-size:20px;margin:0 0 8px}
    p{color:#475569;font-size:14.5px;margin:0 0 20px}
    .btn{display:inline-block;background:#0d6a4e;color:#fff;font-weight:600;font-size:15px;
         padding:12px 22px;border-radius:11px;text-decoration:none}
    .btn:hover{background:#0a5640}
    .muted{margin-top:14px;font-size:12.5px;color:#94a3b8}
  </style>
</head>
<body>
  <div class="card">
    <div class="spin" aria-hidden="true"></div>
    <h1>Taking you to secure payment…</h1>
    <p>You’re being redirected to Paystack to complete your subscription.</p>
    <a class="btn" id="go" href="{{ url }}">Continue to payment</a>
    <div class="muted">If this page doesn’t move on its own, tap the button above.</div>
  </div>
  <script nonce="{{ csp_nonce }}">
    // Explicit redirect (replace() so Back doesn't return to this interstitial).
    window.location.replace({{ url|tojson }});
  </script>
</body>
</html>
