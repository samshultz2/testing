<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support access unavailable</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;padding:24px}
  .card{max-width:440px;text-align:center;background:#1e293b;border:1px solid #334155;
    border-radius:16px;padding:34px 30px}
  .ic{width:56px;height:56px;border-radius:14px;background:#7f1d1d;color:#fff;display:grid;
    place-items:center;font-size:24px;margin:0 auto 16px}
  h1{font-size:20px;margin:0 0 8px} p{color:#94a3b8;line-height:1.6;margin:0}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">⛔</div>
    <h1>Support access link is not valid</h1>
    <p>{{ reason or 'This impersonation link has expired, was already used up, or has been revoked. Generate a new one from the platform console.' }}</p>
  </div>
</body>
</html>
