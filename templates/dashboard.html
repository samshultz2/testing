{% extends "base.html" %}

{% block title %}Dashboard - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Dashboard</span>{% endblock %}

{% block extra_css %}
<style>
/* ===== Modern dashboard ===== */
.dash-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:stretch;gap:1rem;
    /* Theme-aware: derived from the active theme's --primary so the hero recolours
       when the theme changes (green by default, blue/plum/etc. in other themes).
       Flat fallback first for browsers without color-mix(). */
    background:var(--primary);
    background:linear-gradient(135deg,var(--primary) 0%,color-mix(in srgb,var(--primary) 74%,#000) 60%,color-mix(in srgb,var(--primary) 58%,#000) 100%);
    color:#fff;border-radius:var(--radius-xl);
    padding:1.6rem 1.75rem;margin-bottom:1.25rem;
    box-shadow:0 14px 34px -20px rgba(15,23,42,.5);
    box-shadow:0 14px 34px -20px color-mix(in srgb,var(--primary) 60%,#000)}
.dash-hero-main{position:relative;z-index:2;display:flex;flex-direction:column;gap:.1rem;min-width:0}
.dash-hero-eyebrow{display:flex;align-items:center;gap:.5rem;font-size:.95rem;opacity:.9;font-weight:500}
.dash-hero h1{margin:.15rem 0 0;font-size:2.1rem;line-height:1.08;font-weight:800;letter-spacing:-.02em;font-family:var(--font-display)}
.dash-wave{display:inline-block;transform-origin:70% 70%;animation:dash-wave 2.6s ease-in-out infinite}
.dash-hero p{margin:.55rem 0 0;opacity:.85;font-size:1rem}
.dash-hero-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.term-pill{display:inline-flex;align-items:center;gap:.5rem;background:#fff;color:var(--primary);font-weight:700;
    padding:.62rem 1.1rem;border-radius:14px;font-size:.95rem;box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.hero-btn{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.12);color:#fff;border:0;
    padding:.62rem 1.05rem;border-radius:14px;font-size:.95rem;font-weight:600;cursor:pointer;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s ease,transform .1s ease}
.hero-btn:hover{background:rgba(255,255,255,.22)}
.hero-btn:active{transform:translateY(1px)}
.hero-btn.active{background:#fff;color:var(--primary)}
.hero-btn:disabled{opacity:.7;cursor:default}
.dash-hero-art{position:relative;z-index:1;width:230px;max-width:40%;align-self:flex-end;flex-shrink:0}
.dash-hero-dots{position:absolute;top:20px;right:24px;width:66px;height:44px;z-index:1;opacity:.5;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.6) 1.4px,transparent 1.6px);background-size:11px 11px}
@keyframes dash-wave{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}30%{transform:rotate(14deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
@media(max-width:640px){.dash-hero{padding:1.3rem 1.25rem}.dash-hero h1{font-size:2rem}.dash-hero-art{width:120px}}
@media(max-width:420px){.dash-hero-art{display:none}}

.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-bottom:1.25rem}
@media(min-width:1100px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);
    padding:1.1rem;display:flex;align-items:center;gap:.85rem;overflow:hidden;
    box-shadow:var(--shadow-xs);
    transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition)}
.kpi>div:last-child{min-width:0}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--gray-300)}
/* Icon tiles — flat, tinted, theme-aware (no gradients/glow), per the design system.
   A soft tint of the tone colour over the card surface + the tone as the glyph. */
.kpi .ic,.kc-ic{--tone-c:var(--primary);flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:var(--tone-c);background:color-mix(in srgb,var(--tone-c) 16%,var(--bg-card));box-shadow:none}
.kpi .ic{width:46px;height:46px;border-radius:12px;font-size:1.15rem}
.kpi .ic.blue,.kc-ic.blue{--tone-c:#3b82f6}
.kpi .ic.green,.kc-ic.green{--tone-c:#16a34a}
.kpi .ic.amber,.kpi .ic.orange,.kc-ic.orange{--tone-c:#c2760a}
.kpi .ic.red,.kc-ic.red{--tone-c:#ef4444}
.kpi .ic.purple,.kc-ic.purple{--tone-c:#8b5cf6}
.kpi .ic.teal,.kc-ic.teal{--tone-c:#0d9488}
.kpi .v{font-size:1.55rem;font-weight:700;line-height:1.05;letter-spacing:-.01em;font-family:var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .l{font-size:.72rem;color:var(--text-muted);margin-top:.25rem;text-transform:uppercase;letter-spacing:.03em}
/* Delta reads as a subtle chip (bg/padding aren't set inline, so this applies). */
.kpi .kpi-delta{width:fit-content;padding:2px 8px;margin-top:.4rem !important;border-radius:var(--radius-full);background:var(--gray-100)}

/* ── Redesigned headline KPI cards (icon tile + trend badge + big number +
   sub-label + sparkline). Used by the `kpi` block via <KpiCard>. ── */
.kpicard{position:relative;background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);
    padding:1.15rem 1.15rem .35rem;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:var(--shadow-xs);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.kpicard:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--gray-300)}
.kc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem}
.kc-ic{width:50px;height:50px;border-radius:14px;font-size:1.3rem}
.kc-trend{display:flex;flex-direction:column;align-items:flex-end;gap:.2rem;text-align:right}
.kc-badge{display:inline-flex;align-items:center;gap:.28rem;font-size:.82rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;line-height:1.2}
.kc-badge.up{color:var(--success);background:color-mix(in srgb,var(--success) 14%,var(--bg-card))}
.kc-badge.down{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--bg-card))}
.kc-badge.flat{color:var(--text-secondary);background:var(--gray-100)}
.kc-trendlabel{font-size:.75rem;color:var(--text-muted)}
.kc-value{font-size:2.4rem;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:.95rem;
    font-family:var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kc-label{font-size:1.05rem;font-weight:700;margin-top:.15rem}
.kc-sub{font-size:.85rem;color:var(--text-muted);margin-top:.1rem}
.kc-spark{margin:.55rem -1.15rem -.35rem;height:46px}
@keyframes spark-draw{to{stroke-dashoffset:0}}
@keyframes spark-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.dash-wave{animation:none}.kc-spark path,.kc-spark circle{animation:none !important;stroke-dashoffset:0 !important;opacity:1 !important;transform:none !important}}
@media(max-width:640px){.kc-value{font-size:2rem}.kc-ic{width:46px;height:46px;font-size:1.2rem}}

.dash-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:1rem}
@media(min-width:992px){.dash-grid.c3{grid-template-columns:repeat(3,1fr)}.dash-grid.c2{grid-template-columns:repeat(2,1fr)}
    .dash-grid.split{grid-template-columns:2fr 1fr}}
.widget{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.widget .wh{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--border-light)}
.widget .wh h3{margin:0;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.45rem}
.widget .wh h3 i{color:var(--primary)}
.widget .wb{padding:1rem;flex:1}
.chart-box{position:relative;height:210px}

.lead-list{display:flex;flex-direction:column}
.lead-item{display:flex;align-items:center;gap:.7rem;padding:.55rem .15rem;border-bottom:1px solid var(--border-light)}
.lead-item:last-child{border-bottom:none}
.lead-rank{width:26px;height:26px;border-radius:50%;background:var(--gray-100);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.lead-rank.g1{background:linear-gradient(135deg,#f5af19,#f12711);color:#fff}
.lead-rank.g2{background:linear-gradient(135deg,#e0e0e0,#808b96);color:#fff}
.lead-rank.g3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
.lead-name{flex:1;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-score{font-weight:700;font-size:.9rem}

.quick-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.recent-item,.birthday-item{display:flex;align-items:center;gap:.7rem;padding:.5rem;border-radius:var(--radius-md);text-decoration:none;color:inherit}
.recent-item{border-bottom:1px solid var(--border-light)}
.recent-item:hover{background:var(--gray-50)}
.recent-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.recent-avatar.male{background:#3b82f6}.recent-avatar.female{background:#f43f5e}
.recent-name,.birthday-name{font-weight:600;font-size:.85rem}
.recent-id,.birthday-date{font-size:.72rem;color:var(--text-muted)}
.birthday-item.highlight{background:var(--warning-light)}
.birthday-avatar{font-size:1.4rem}
.act-item{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid var(--border-light);font-size:.8rem}
.act-item:last-child{border-bottom:none}
.act-item .badge{flex-shrink:0}
.relig-bar{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.relig-bar .lab{width:78px;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.relig-bar .track{flex:1;height:8px;background:var(--gray-100);border-radius:var(--radius-full);overflow:hidden}
.relig-bar .fill{height:100%;border-radius:var(--radius-full);background:var(--primary)}
.relig-bar .num{width:28px;text-align:right;font-weight:700;font-size:.8rem}

/* =====================================================================
   Dashboard v2 — laptop: header + quick actions + KPI band, then a main
   column and a sticky "today" rail (no long scroll). Phone: compact header,
   swipeable quick actions, sticky app-style section tabs.
   ===================================================================== */
.dx{display:flex;flex-direction:column;gap:1rem;min-width:0;--dx-top:56px}
.dx *{min-width:0}
.dx .dash-block > .widget,.dx .dash-block > .card,.dx .dash-block > .kpi-row,.dx .dash-block > :last-child{margin-bottom:0 !important}
.dx .dash-block > .kpi-row + .dash-grid,.dx .dash-block > .kpi-row + .dx-kpis{margin-top:1rem}
.dx .dash-grid{margin-bottom:0}
.dx .dash-block .dash-grid + .dash-grid{margin-top:1rem}
.dx .widget{border-radius:16px;box-shadow:var(--shadow-xs)}
.dx .widget .wh{padding:.8rem 1rem}
.dx .widget .wh h3{font-size:.9rem;font-weight:700}
/* empty widgets collapse to a slim line instead of a tall blank chart */
.dx .chart-box:has(.empty-state){height:auto !important}
.dx .empty-state{padding:1rem .5rem;display:flex;align-items:center;justify-content:center;gap:.6rem;text-align:left}
.dx .empty-state i{width:34px;height:34px;font-size:.9rem;margin:0;flex:0 0 auto}
.dx .empty-state p{margin:0;font-size:.82rem}

/* header */
.dx-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  padding:1.1rem 1.3rem;border-radius:18px;color:#fff;position:relative;overflow:hidden;
  background:var(--primary);
  background:linear-gradient(120deg,var(--primary) 0%,color-mix(in srgb,var(--primary) 70%,#000) 100%);
  box-shadow:0 12px 30px -22px color-mix(in srgb,var(--primary) 70%,#000)}
.dx-head::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.dx-hello{position:relative;z-index:1}
.dx-eyebrow{font-size:.85rem;opacity:.85;font-weight:500}
.dx-hello h1{margin:.05rem 0 .3rem;font-size:1.6rem;line-height:1.1;font-weight:800;letter-spacing:-.02em;font-family:var(--font-display);color:#fff}
.dx-hello p{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .7rem;font-size:.85rem;opacity:.92}
.dx-sep::before{content:"·";margin-right:.7rem;opacity:.6}
.dx-term{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.95);color:var(--primary);
  font-weight:700;font-size:.78rem;padding:.25rem .6rem;border-radius:999px}
.dx-tools{display:flex;align-items:center;gap:.45rem;position:relative;z-index:1}
.dx-updated{font-size:.74rem;opacity:.75;margin-right:.3rem}
.dx-tool{display:inline-flex;align-items:center;gap:.45rem;border:0;cursor:pointer;color:#fff;font:inherit;font-size:.84rem;font-weight:600;
  background:rgba(255,255,255,.14);padding:.5rem .85rem;border-radius:12px;transition:background .15s}
.dx-tool:hover{background:rgba(255,255,255,.24)}
.dx-tool.on{background:#fff;color:var(--primary)}
.dx-tool:disabled{opacity:.7;cursor:default}

/* quick actions */
.dx-qa{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem;background:var(--bg-card);border:1px solid var(--border-color);
  border-radius:16px;box-shadow:var(--shadow-xs)}
.dx-qa-item{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .8rem .45rem .45rem;border-radius:12px;
  text-decoration:none;color:var(--text-primary);font-size:.84rem;font-weight:600;transition:background .15s}
.dx-qa-item:hover{background:var(--gray-50,#f1f5f9)}
.dx-qa-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--bg-card))}
.dx-qa-item.primary .dx-qa-ic{background:var(--primary);color:#fff}

.dx-arrange{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;border-radius:12px;font-size:.85rem;
  background:color-mix(in srgb,var(--info,#2563eb) 10%,var(--bg-card));border:1px solid color-mix(in srgb,var(--info,#2563eb) 25%,transparent)}
.dx-arrange span{flex:1}

/* columns */
.dx-cols{display:flex;flex-direction:column;gap:1rem}
.dx-main,.dx-rail{display:contents}
.dx-class-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem}
.dx-class{border:1px solid var(--border-color);border-radius:12px;padding:.75rem}
.dx-class-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.55rem}
.dx-class-a{display:flex;gap:.4rem;flex-wrap:wrap}
.dx-class-a .btn{flex:1}
.dx-ann-item{display:flex;gap:.6rem;align-items:flex-start;padding:.65rem .1rem .65rem .6rem;border-left:3px solid;margin:.35rem 0;border-radius:2px}
@media (min-width:1200px){
  .dx-cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;align-items:start}
  .dx-main,.dx-rail{display:flex;flex-direction:column;gap:1rem}
  .dx-rail{position:sticky;top:calc(var(--dx-top) + 12px);max-height:calc(100vh - var(--dx-top) - 24px);overflow-y:auto;
    scrollbar-width:thin;padding-right:2px;margin-right:-2px}
  .dx-rail .dash-grid{grid-template-columns:1fr !important}
  .dx-rail .dash-block{order:0 !important}
  .dx-main .dash-block{order:0 !important}
}
@media (min-width:1500px){ .dx-cols{grid-template-columns:minmax(0,1fr) 400px} }
/* exec band: six tiles in one row on wide screens */
@media (min-width:760px){ .dx .dash-block[data-block="exec_summary"] .kpi-row,.dx .dash-block[data-block="finance_health"] > .kpi-row{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))} }
.dx .dash-block[data-block="exec_summary"] .kpi{padding:.85rem .9rem;gap:.7rem}
.dx .dash-block[data-block="exec_summary"] .kpi .ic{width:40px;height:40px;border-radius:11px;font-size:1rem}
.dx .dash-block[data-block="exec_summary"] .kpi .v{font-size:1.35rem}
.dx .dash-block[data-block="exec_summary"] .widget .wb{padding:.85rem}
.dx-kpis.kpi-row{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* tabs (phone) */
.dx-tabs{position:sticky;top:var(--dx-top);z-index:40;display:flex;gap:.25rem;margin:0 calc(-1 * var(--sp-4,16px));
  padding:.45rem var(--sp-4,16px);background:color-mix(in srgb,var(--bg-body) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--border-color)}
.dx-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:.15rem;border:0;background:none;cursor:pointer;font:inherit;
  font-size:.7rem;font-weight:600;color:var(--text-muted);padding:.35rem .2rem;border-radius:10px;transition:background .15s,color .15s}
.dx-tab i{font-size:1rem}
.dx-tab.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 11%,transparent)}

@media (max-width:759px){
  .dx{gap:.85rem}
  .dx-head{padding:.95rem 1rem;border-radius:16px;gap:.6rem;align-items:flex-start}
  .dx-hello h1{font-size:1.35rem}
  .dx-hello p{font-size:.78rem}
  .dx-updated,.dx-tool span{display:none}
  .dx-tools{position:absolute;top:.8rem;right:.8rem;gap:.3rem}
  .dx-tool{width:36px;height:36px;padding:0;justify-content:center;border-radius:11px}
  .dx-hello{padding-right:7.2rem}
  /* app-style swipeable shortcuts */
  .dx-qa{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;gap:.15rem;padding:.7rem .4rem;
    margin:0 calc(-1 * var(--sp-4,16px));border-radius:0;border-left:0;border-right:0;scrollbar-width:none}
  .dx-qa::-webkit-scrollbar{display:none}
  .dx-qa-item{flex:0 0 74px;flex-direction:column;gap:.35rem;padding:.2rem .15rem;text-align:center;scroll-snap-align:start;
    font-size:.68rem;font-weight:600;line-height:1.2;-webkit-tap-highlight-color:transparent}
  .dx-qa-item:active .dx-qa-ic{transform:scale(.92)}
  .dx-qa-ic{width:50px;height:50px;border-radius:16px;font-size:1.1rem;transition:transform .12s}
  .dx-qa-l{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .dx .kpi-row{gap:.6rem}
  .dx .kpi{padding:.75rem;gap:.6rem;border-radius:14px}
  .dx .kpi .ic{width:38px;height:38px;font-size:.95rem;border-radius:11px}
  .dx .kpi .v{font-size:1.2rem}
  .dx .kpi .l{font-size:.64rem}
  .dx .kpicard{padding:.9rem .9rem .3rem;border-radius:14px}
  .dx .kc-value{font-size:1.6rem;margin-top:.6rem}
  .dx .kc-label{font-size:.9rem}
  .dx .kc-ic{width:40px;height:40px;font-size:1rem}
  .dx .kc-spark{margin:.4rem -.9rem -.3rem;height:36px}
  .dx .chart-box{height:190px}
  .dx .widget{border-radius:14px}
  .dx .dash-block[data-block="exec_summary"] > .widget{background:none;border:0;box-shadow:none}
  .dx .dash-block[data-block="exec_summary"] > .widget > .wh{display:none}
  .dx .dash-block[data-block="exec_summary"] > .widget > .wb{padding:0}
  .dx-kpis.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dx-sep::before{display:none}
  .dx-hello p{gap:.3rem .5rem}
  /* headline tiles: icon over number, so values get the full tile width */
  .dx .dash-block[data-block="exec_summary"] .kpi,.dx .dx-kpis.compact .kpi{flex-direction:column;align-items:flex-start;gap:.45rem}
  .dx .dash-block[data-block="exec_summary"] .kpi .ic,.dx .dx-kpis.compact .kpi .ic{width:34px;height:34px;font-size:.88rem}
  .dx-class-list{grid-template-columns:1fr}
}
</style>
{% endblock %}

{% block content %}
<div id="dashboard-app"><p class="text-muted" style="padding:2rem 0">Loading dashboard…</p></div>
<script type="application/json" id="dash-data">{{ dash_json|tojson }}</script>
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script src="{{ bundle_url('js/react/dashboard-app.js') }}" defer></script>
{% endblock %}
