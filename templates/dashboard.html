{% extends "base.html" %}

{% block title %}Dashboard - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Dashboard</span>{% endblock %}

{% block extra_css %}
<style>
/* ===== Modern dashboard ===== */
.dash-hero{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;
    background:linear-gradient(135deg,var(--primary),#064e36);color:#fff;border-radius:var(--radius-lg);
    padding:1.25rem 1.5rem;margin-bottom:1.1rem;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
.dash-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.dash-hero>*{position:relative;z-index:1}
.dash-hero-actions{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.dash-hero h1{margin:0;font-size:1.4rem;font-family:var(--font-display)}
.dash-hero p{margin:.2rem 0 0;opacity:.9;font-size:.9rem}
.dash-hero .term-chip{background:rgba(255,255,255,.18);padding:.5rem .9rem;border-radius:var(--radius-full);font-size:.85rem;font-weight:600;backdrop-filter:blur(4px);z-index:1}

.kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-bottom:1.1rem}
@media(min-width:768px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-xl);
    padding:1.1rem;display:flex;align-items:center;gap:.85rem;overflow:hidden;
    box-shadow:0 1px 2px rgba(15,23,42,.04),0 10px 28px -14px rgba(15,23,42,.16);
    transition:transform var(--transition),box-shadow var(--transition),border-color var(--transition)}
.kpi>div:last-child{min-width:0}
.kpi:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(15,23,42,.05),0 18px 40px -16px rgba(15,23,42,.22);border-color:var(--gray-300)}
.kpi .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:1.2rem;color:#fff;flex-shrink:0;
    box-shadow:0 6px 14px -6px rgba(15,23,42,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.kpi .ic.blue{background:linear-gradient(135deg,#4e73df,#224abe)}
.kpi .ic.green{background:linear-gradient(135deg,#1cc88a,#13855c)}
.kpi .ic.amber{background:linear-gradient(135deg,#f6c23e,#dda20a)}
.kpi .ic.red{background:linear-gradient(135deg,#e74a3b,#be2617)}
.kpi .ic.purple{background:linear-gradient(135deg,#7e6cf0,#5a48c9)}
.kpi .ic.teal{background:linear-gradient(135deg,#11998e,#38ef7d)}
.kpi .v{font-size:1.55rem;font-weight:700;line-height:1.05;letter-spacing:-.01em;font-family:var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .l{font-size:.72rem;color:var(--text-muted);margin-top:.25rem;text-transform:uppercase;letter-spacing:.03em}
/* Delta reads as a subtle chip (bg/padding aren't set inline, so this applies). */
.kpi .kpi-delta{width:fit-content;padding:2px 8px;margin-top:.4rem !important;border-radius:var(--radius-full);background:var(--gray-100)}

.dash-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-bottom:1rem}
@media(min-width:992px){.dash-grid.c3{grid-template-columns:repeat(3,1fr)}.dash-grid.c2{grid-template-columns:repeat(2,1fr)}
    .dash-grid.split{grid-template-columns:2fr 1fr}}
.widget{background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column}
.widget .wh{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--border-light)}
.widget .wh h3{margin:0;font-size:.85rem;font-weight:600;display:flex;align-items:center;gap:.45rem}
.widget .wh h3 i{color:var(--primary)}
.widget .wb{padding:1rem;flex:1}
.chart-box{position:relative;height:210px}

/* exam snapshot cards */
.exam-card{padding:1.1rem;border-radius:var(--radius-lg);color:#fff;display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
.exam-card.jamb{background:linear-gradient(135deg,#667eea,#764ba2)}
.exam-card.waec{background:linear-gradient(135deg,#0891b2,#0e7490)}
.exam-card.mock{background:linear-gradient(135deg,#11998e,#38ef7d)}
.exam-card .top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;opacity:.9}
.exam-card .big{font-size:2.5rem;font-weight:700;line-height:1;font-family:var(--font-display)}
.exam-card .sub{font-size:.8rem;opacity:.9}
.exam-card .chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.exam-card .chip{background:rgba(255,255,255,.2);border-radius:var(--radius-full);padding:.12rem .55rem;font-size:.72rem}

.lead-list{display:flex;flex-direction:column}
.lead-item{display:flex;align-items:center;gap:.7rem;padding:.55rem .15rem;border-bottom:1px solid var(--border-light)}
.lead-item:last-child{border-bottom:none}
.lead-rank{width:26px;height:26px;border-radius:50%;background:var(--gray-100);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex-shrink:0}
.lead-rank.g1{background:linear-gradient(135deg,#f5af19,#f12711);color:#fff}
.lead-rank.g2{background:linear-gradient(135deg,#e0e0e0,#808b96);color:#fff}
.lead-rank.g3{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
.lead-name{flex:1;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-score{font-weight:700;font-size:.9rem}

.quick-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.recent-item,.birthday-item{display:flex;align-items:center;gap:.7rem;padding:.5rem;border-radius:var(--radius-md);text-decoration:none;color:inherit}
.recent-item{border-bottom:1px solid var(--border-light)}
.recent-item:hover{background:var(--gray-50)}
.recent-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.recent-avatar.male{background:#4e73df}.recent-avatar.female{background:#e74a3b}
.recent-name,.birthday-name{font-weight:600;font-size:.85rem}
.recent-id,.birthday-date{font-size:.72rem;color:var(--text-muted)}
.birthday-item.highlight{background:var(--warning-light)}
.birthday-avatar{font-size:1.4rem}
.act-item{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid var(--border-light);font-size:.8rem}
.act-item:last-child{border-bottom:none}
.act-item .badge{flex-shrink:0}
.relig-bar{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.relig-bar .lab{width:78px;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.relig-bar .track{flex:1;height:8px;background:var(--gray-100);border-radius:var(--radius-full);overflow:hidden}
.relig-bar .fill{height:100%;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--primary),#38ef7d)}
.relig-bar .num{width:28px;text-align:right;font-weight:700;font-size:.8rem}
</style>
{% endblock %}

{% block content %}
<div id="dashboard-app"><p class="text-muted" style="padding:2rem 0">Loading dashboard…</p></div>
<script type="application/json" id="dash-data">{{ dash_json|tojson }}</script>
<script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
<script src="{{ bundle_url('js/react/dashboard-app.js') }}" defer></script>
{% endblock %}
