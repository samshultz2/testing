{% extends "base.html" %}
{% block title %}Add WAEC - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Add WAEC</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Add WAEC Results</h1></div>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-row">
                <div class="form-group"><label class="form-label">Student <span class="required">*</span></label><select name="student_id" class="form-control" required><option value="">Select</option>{% for s in students %}<option value="{{ s.id }}">{{ s.full_name }}</option>{% endfor %}</select></div>
                <div class="form-group"><label class="form-label">Year <span class="required">*</span></label><input type="number" name="exam_year" class="form-control" min="2000" max="2030" required></div>
            </div>
            <h3 class="mb-3 mt-3">Subject Grades</h3>
            {% for i in range(9) %}
            <div class="form-row">
                <div class="form-group"><label class="form-label">Subject {{ i+1 }}</label><select name="subject[]" class="form-control"><option value="">Select</option>{% for subj in subjects %}<option value="{{ subj }}">{{ subj }}</option>{% endfor %}</select></div>
                <div class="form-group"><label class="form-label">Grade</label><select name="grade[]" class="form-control"><option value="">Select</option>{% for g in grades %}<option value="{{ g }}">{{ g }}</option>{% endfor %}</select></div>
            </div>
            {% endfor %}
            <div class="page-header-actions mt-3">
                <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-save"></i> Save</button>
                <a href="{{ url_for('results.waec_list') }}" class="btn btn-secondary btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
