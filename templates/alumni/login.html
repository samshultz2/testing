{% extends "alumni/base.html" %}
{% block title %}Alumni Login{% endblock %}
{% block content %}
<div class="portal-card" style="max-width:440px;margin:6vh auto 0;">
    <div style="text-align:center;margin-bottom:1rem;">
        <div style="font-size:2.4rem;color:#0d6a4e;"><i class="fas fa-user-graduate"></i></div>
        <h1 style="margin-top:.4rem;">Alumni Portal</h1>
        <p class="text-muted" style="margin:0;">Sign in to view your documents and keep your details up to date.</p>
    </div>
    <form method="POST" action="{{ url_for('alumni.login') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label">Admission Number</label>
            <input type="text" name="student_id" class="form-control" placeholder="e.g. STU00001" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label">Password or Verification Code</label>
            <input type="text" name="credential" class="form-control" autocomplete="off"
                   placeholder="Your portal password or a document code" required>
            <small class="text-muted">Use your student-portal password, or a verification code printed on any
                document the school issued you.</small>
        </div>
        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-right-to-bracket"></i> Log in</button>
    </form>
</div>
{% endblock %}
