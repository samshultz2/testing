<div class="mjs-q" data-qid="{{ q.id }}">
    <div class="qh">{{ q.question_text }}</div>
    {% if q.image_url %}<img src="{{ q.image_url }}" alt="figure">{% endif %}
    {% for opt, val in q.options %}{% if val %}
    <label class="mjs-opt">
        <input type="radio" name="q{{ q.id }}" value="{{ opt }}" {{ 'checked' if saved.get(q.id) == opt else '' }}>
        <span><strong>{{ opt }}.</strong> {{ val }}</span>
    </label>
    {% endif %}{% endfor %}
</div>
