<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email — EduSyncra</title>
  <style>
    :root { --ink:#1b2230; --soft:#4a5468; --line:#dbe1ec; --accent:#3f57c8; --bg:#eef1f6; --surface:#fff; }
    @media (prefers-color-scheme: dark){ :root{ --ink:#e7ebf3; --soft:#a3adc0; --line:#262d3a; --accent:#8496f2; --bg:#0d1017; --surface:#151a23; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
           color:var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px;
            width:100%; max-width:460px; box-shadow:0 10px 40px -20px rgba(20,28,48,.4); text-align:center; }
    h1 { font-size:22px; margin:0 0 8px; }
    p { color:var(--soft); font-size:14.5px; line-height:1.55; }
    .dev { margin-top:20px; padding:14px; border:1px dashed var(--accent); border-radius:10px; text-align:left; }
    .dev b { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--accent); }
    .dev a { word-break:break-all; font-size:13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Almost there — check your email</h1>
    <p>We've sent a confirmation link to <strong>{{ email }}</strong>. Click it to finish setting up your school; your portal and login are created automatically the moment you confirm.</p>
    {% if dev_link %}
      <div class="dev">
        <b>Dev mode — no mail configured</b>
        <p style="margin:6px 0 0"><a href="{{ dev_link }}">{{ dev_link }}</a></p>
      </div>
    {% endif %}
  </div>
</body>
</html>
