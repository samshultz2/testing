{% extends "base.html" %}
{% block title %}Edit User - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Edit User</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit User: {{ user.username }}</h1></div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" value="{{ user.username }}" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="full_name" class="form-control" value="{{ user.full_name or '' }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email or '' }}">
                </div>
                <div class="form-group">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-control">
                        <option value="teacher" {% if user.role == 'teacher' %}selected{% endif %}>Teacher</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                        <option value="readonly" {% if user.role == 'readonly' %}selected{% endif %}>Read Only</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="password" class="form-control" placeholder="Leave blank to keep current">
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" name="is_active" id="is_active" {% if user.is_active %}checked{% endif %}>
                <label for="is_active">Active</label>
            </div>
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                <a href="{{ url_for('settings.users_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
