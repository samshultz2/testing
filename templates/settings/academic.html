{% extends "base.html" %}
{% block title %}Academic Settings - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Academic Settings</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Academic Settings</h1></div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <h4 style="margin-bottom: 1rem; color: var(--text-secondary);">School Hours</h4>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">School Day Start</label>
                    <input type="time" name="school_day_start" class="form-control" value="{{ settings.get('school_day_start', '08:20') }}">
                </div>
                <div class="form-group">
                    <label class="form-label">School Day End</label>
                    <input type="time" name="school_day_end" class="form-control" value="{{ settings.get('school_day_end', '14:10') }}">
                </div>
            </div>
            
            <h4 style="margin: 1.5rem 0 1rem; color: var(--text-secondary);">Period Configuration</h4>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Period Duration (minutes)</label>
                    <input type="number" name="period_duration" class="form-control" value="{{ settings.get('period_duration', '40') }}" min="20" max="90">
                </div>
                <div class="form-group">
                    <label class="form-label">Break Duration (minutes)</label>
                    <input type="number" name="break_duration" class="form-control" value="{{ settings.get('break_duration', '30') }}" min="5" max="60">
                </div>
                <div class="form-group">
                    <label class="form-label">Periods Per Day</label>
                    <input type="number" name="periods_per_day" class="form-control" value="{{ settings.get('periods_per_day', '8') }}" min="4" max="12">
                </div>
            </div>
            
            <h4 style="margin: 1.5rem 0 1rem; color: var(--text-secondary);">Grading & Promotion</h4>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Pass Mark (%)</label>
                    <input type="number" name="pass_mark" class="form-control" value="{{ settings.get('pass_mark', '50') }}" min="30" max="70">
                </div>
                <div class="form-group">
                    <label class="form-label">Promotion Threshold (%)</label>
                    <input type="number" name="promotion_threshold" class="form-control" value="{{ settings.get('promotion_threshold', '50') }}" min="30" max="70" step="0.1">
                    <small class="text-muted">Minimum average to be promoted</small>
                </div>
            </div>
            
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                <a href="{{ url_for('settings.index') }}" class="btn btn-secondary">Back</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
