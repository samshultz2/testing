{% extends "base.html" %}
{% block title %}Grade Scale - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Grade Scale</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Grade Scale</h1></div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('settings.save_grades') }}">
            <div class="table-container">
                <table class="data-table" id="gradesTable">
                    <thead>
                        <tr>
                            <th>Grade</th>
                            <th>Min Score</th>
                            <th>Max Score</th>
                            <th>Remark</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for grade in grades %}
                        <tr>
                            <td><input type="text" name="grade[]" class="form-control" value="{{ grade.grade }}" style="width: 60px;"></td>
                            <td><input type="number" name="min_score[]" class="form-control" value="{{ grade.min_score }}" style="width: 80px;"></td>
                            <td><input type="number" name="max_score[]" class="form-control" value="{{ grade.max_score }}" style="width: 80px;"></td>
                            <td><input type="text" name="remark[]" class="form-control" value="{{ grade.remark }}"></td>
                            <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="page-header-actions mt-3">
                <button type="button" class="btn btn-secondary" onclick="addGradeRow()"><i class="fas fa-plus"></i> Add Grade</button>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                <a href="{{ url_for('settings.index') }}" class="btn btn-secondary">Back</a>
            </div>
        </form>
    </div>
</div>

<script>
function addGradeRow() {
    const tbody = document.querySelector('#gradesTable tbody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td><input type="text" name="grade[]" class="form-control" placeholder="A+" style="width: 60px;"></td>
        <td><input type="number" name="min_score[]" class="form-control" placeholder="80" style="width: 80px;"></td>
        <td><input type="number" name="max_score[]" class="form-control" placeholder="100" style="width: 80px;"></td>
        <td><input type="text" name="remark[]" class="form-control" placeholder="Excellent"></td>
        <td><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()"><i class="fas fa-times"></i></button></td>
    `;
    tbody.appendChild(row);
}
</script>
{% endblock %}
