<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a new password — EduSyncra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
               min-height:100vh; display:flex; align-items:center; justify-content:center;
               background:linear-gradient(135deg,#0d6a4e 0%,#1a1f26 100%); padding:1rem; }
        .card { background:#fff; border-radius:16px; padding:2rem; width:100%; max-width:400px;
                box-shadow:0 20px 40px rgba(0,0,0,.3); }
        h1 { font-size:1.3rem; color:#333; margin-bottom:.3rem; } p.sub { color:#666; font-size:.875rem; margin-bottom:1.2rem; }
        label { display:block; font-weight:500; margin:.6rem 0 .4rem; color:#333; font-size:.875rem; }
        .form-control { width:100%; padding:.75rem 1rem; border:2px solid #e0e0e0; border-radius:8px; font-size:1rem; }
        .btn { width:100%; padding:.875rem; margin-top:1rem; background:linear-gradient(135deg,#0d6a4e,#11998e);
               color:#fff; border:none; border-radius:8px; font-size:1rem; font-weight:600; cursor:pointer; }
        .btn:disabled { opacity:.55; cursor:not-allowed; }
        .flash { padding:.75rem 1rem; border-radius:8px; margin-bottom:1rem; font-size:.875rem; background:#fee2e2; color:#b91c1c; }
        .alt { display:block; text-align:center; margin-top:1rem; color:#0d6a4e; text-decoration:none; font-size:.85rem; }
        .pw-reqs { list-style:none; margin:.5rem 0 .2rem; padding:0; display:grid; gap:4px; }
        .pw-reqs li { font-size:.78rem; color:#777; display:flex; align-items:center; gap:8px; }
        .pw-reqs li i { font-size:7px; }
        .pw-reqs li.ok { color:#0d6a4e; }
        .pw-reqs li.ok i::before { content:"\f00c"; font-size:11px; }   /* fa-check */
        .pw-match { display:block; font-size:.78rem; margin-top:.4rem; }
        .pw-match.bad { color:#b91c1c; } .pw-match.good { color:#0d6a4e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set a new password</h1>
        <p class="sub">Choose a strong password for your account.</p>
        {% with messages = get_flashed_messages() %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
        <form method="POST" action="{{ url_for('auth.reset_password', uid=uid, token=token) }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label>New password</label>
            <input type="password" id="password" name="password" class="form-control" required autofocus
                   minlength="12" autocomplete="new-password" placeholder="At least 12 characters">
            <ul id="pw-reqs" class="pw-reqs">
                {% for r in password_rules %}
                <li data-rule="{{ r.id }}"><i class="fas fa-circle"></i> {{ r.label }}</li>
                {% endfor %}
            </ul>
            <label>Confirm new password</label>
            <input type="password" id="confirm" name="confirm" class="form-control" required
                   minlength="12" autocomplete="new-password" placeholder="Repeat new password">
            <small id="pw-match" class="pw-match"></small>
            <button type="submit" id="pw-submit" class="btn"><i class="fas fa-key"></i> Reset password</button>
        </form>
        <a class="alt" href="{{ url_for('auth.login') }}">← Back to login</a>
    </div>
    <script nonce="{{ csp_nonce }}">
    (function () {
        var pw = document.getElementById('password'),
            cf = document.getElementById('confirm'),
            reqs = document.getElementById('pw-reqs'),
            match = document.getElementById('pw-match'),
            submit = document.getElementById('pw-submit');
        if (!pw) return;
        // Rules come from the server (single source of truth: utils.security).
        var RULES = {{ password_rules | tojson }};
        function test(rule, v) {
            return rule.min_length != null ? v.length >= rule.min_length : new RegExp(rule.regex).test(v);
        }
        var byId = {};
        RULES.forEach(function (r) { byId[r.id] = r; });
        function evaluate() {
            var v = pw.value, allOk = true;
            reqs.querySelectorAll('li').forEach(function (li) {
                var rule = byId[li.getAttribute('data-rule')];
                var ok = rule ? test(rule, v) : true;
                li.classList.toggle('ok', ok);
                if (!ok) allOk = false;
            });
            if (cf.value) {
                var m = cf.value === v;
                match.textContent = m ? 'Passwords match' : 'Passwords do not match';
                match.className = 'pw-match ' + (m ? 'good' : 'bad');
                if (!m) allOk = false;
            } else { match.textContent = ''; match.className = 'pw-match'; }
            submit.disabled = !allOk;
        }
        pw.addEventListener('input', evaluate);
        cf.addEventListener('input', evaluate);
        evaluate();
    })();
    </script>
</body>
</html>
