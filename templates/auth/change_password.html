{% extends "base.html" %}
{% block title %}Change Password — {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header">
    <div><h1>Change Password</h1>
        <p class="text-muted text-sm">Choose a new password for your account.</p></div>
</div>

<div class="card" style="max-width:480px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required
                       autocomplete="current-password">
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" required
                       minlength="6" autocomplete="new-password" placeholder="Min 6 characters">
            </div>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" name="confirm_password" class="form-control" required
                       autocomplete="new-password" placeholder="Repeat new password">
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
