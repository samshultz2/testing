{% extends "base.html" %}
{% block title %}Change Password — {{ app_name }}{% endblock %}
{% block content %}
<div class="page-header">
    <div><h1>Change Password</h1>
        <p class="text-muted text-sm">Choose a new password for your account.</p></div>
</div>

<div class="card" style="max-width:480px;">
    <div class="card-body">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" name="current_password" class="form-control" required
                       autocomplete="current-password">
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required
                       minlength="12" autocomplete="new-password" placeholder="At least 12 characters">
            </div>
            <ul id="pw-reqs" class="pw-reqs">
                {% for r in password_rules %}
                <li data-rule="{{ r.id }}"><i class="fas fa-circle"></i> {{ r.label }}</li>
                {% endfor %}
            </ul>
            <div class="form-group">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required
                       autocomplete="new-password" placeholder="Repeat new password">
                <small id="pw-match" class="pw-match"></small>
            </div>
            <button type="submit" id="pw-submit" class="btn btn-primary"><i class="fas fa-key"></i> Update Password</button>
        </form>
    </div>
</div>

<style nonce="{{ csp_nonce }}">
    .pw-reqs { list-style:none; margin:-6px 0 14px; padding:0; display:grid; gap:4px; }
    .pw-reqs li { font-size:12.5px; color:var(--text-muted,#7b8598); display:flex; align-items:center; gap:8px; }
    .pw-reqs li i { font-size:7px; }
    .pw-reqs li.ok { color:#14875a; }
    .pw-reqs li.ok i::before { content:"\f00c"; font-size:11px; }   /* fa-check */
    .pw-match { font-size:12.5px; }
    .pw-match.bad { color:#c8384a; } .pw-match.good { color:#14875a; }
</style>
<script nonce="{{ csp_nonce }}">
(function () {
    var pw = document.getElementById('new_password'),
        cf = document.getElementById('confirm_password'),
        reqs = document.getElementById('pw-reqs'),
        match = document.getElementById('pw-match'),
        submit = document.getElementById('pw-submit');
    if (!pw) return;
    // Rules come from the server (single source of truth: utils.security).
    var RULES = {{ password_rules | tojson }};
    function test(rule, v) {
        return rule.min_length != null ? v.length >= rule.min_length : new RegExp(rule.regex).test(v);
    }
    var byId = {};
    RULES.forEach(function (r) { byId[r.id] = r; });
    function evaluate() {
        var v = pw.value, allOk = true;
        reqs.querySelectorAll('li').forEach(function (li) {
            var rule = byId[li.getAttribute('data-rule')];
            var ok = rule ? test(rule, v) : true;
            li.classList.toggle('ok', ok);
            if (!ok) allOk = false;
        });
        if (cf.value) {
            var m = cf.value === v;
            match.textContent = m ? 'Passwords match' : 'Passwords do not match';
            match.className = 'pw-match ' + (m ? 'good' : 'bad');
            if (!m) allOk = false;
        } else { match.textContent = ''; match.className = 'pw-match'; }
        submit.disabled = !allOk;
    }
    pw.addEventListener('input', evaluate);
    cf.addEventListener('input', evaluate);
    evaluate();
})();
</script>
{% endblock %}
