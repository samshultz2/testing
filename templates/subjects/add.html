{% extends "base.html" %}
{% block title %}Add Subject - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Add Subject</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Add Subject</h1></div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Subject Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Mathematics">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Short Name</label>
                    <input type="text" name="short_name" class="form-control" placeholder="e.g., MATH" maxlength="10">
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select name="category" class="form-control">
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" name="has_practical" id="has_practical" class="form-check-input" checked>
                <label for="has_practical" class="form-check-label">Has Midterm / Practical (P/ME)</label>
                <span class="form-hint d-block">If unchecked, the Midterm column is dropped and the Theory paper is worth 50 (instead of 40).</span>
            </div>
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                <a href="{{ url_for('subjects.subjects_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
