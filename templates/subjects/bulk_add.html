{% extends "base.html" %}
{% block title %}Bulk Add Subjects - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Bulk Add</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Bulk Add Subjects</h1></div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Category</label>
                <select name="category" class="form-control">
                    {% for cat in categories %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Subjects (one per line)</label>
                <textarea name="subjects" class="form-control" rows="15" placeholder="Mathematics
English Language
Physics
Chemistry
Biology
...">Mathematics
English Language
Civic Education
Physics
Chemistry
Biology
Further Mathematics
Agricultural Science
Economics
Geography
Government
Literature in English
Commerce
Accounting
Computer Studies
Christian Religious Studies
Islamic Religious Studies
French
Yoruba
Igbo
Hausa
Technical Drawing
Food and Nutrition
Home Economics
Physical Education
History
Music
Visual Arts</textarea>
            </div>
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Add All</button>
                <a href="{{ url_for('subjects.subjects_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
