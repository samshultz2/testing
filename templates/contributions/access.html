<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Required</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a5f4a 0%, #0d3328 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .access-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .access-icon {
            width: 80px;
            height: 80px;
            background: #1a5f4a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        .access-icon i { font-size: 2rem; color: white; }
        h1 { color: #1a5f4a; margin-bottom: 0.5rem; font-size: 1.5rem; }
        p { color: #666; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 0.5em;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #1a5f4a;
        }
        button {
            width: 100%;
            padding: 1rem;
            background: #1a5f4a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #0d3328; }
        .flash-error {
            background: #fee;
            color: #c00;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .back-link {
            display: block;
            margin-top: 1.5rem;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover { color: #1a5f4a; }
    </style>
</head>
<body>
    <div class="access-card">
        <div class="access-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h1>Restricted Access</h1>
        <p>Enter the access code to continue</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
            <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="form-group">
                <input type="password" name="access_code" placeholder="••••••••" autofocus required>
            </div>
            <button type="submit"><i class="fas fa-unlock"></i> Access</button>
        </form>
        
        <a href="{{ url_for('main.dashboard') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</body>
</html>
