{% extends "base.html" %}
{% block title %}Edit Session - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Edit Session</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit Session: {{ academic_session.name }}</h1></div>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group"><label class="form-label">Session Name <span class="required">*</span></label><input type="text" name="name" class="form-control" value="{{ academic_session.name }}" placeholder="e.g., 2024/2025" required></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control" value="{{ academic_session.start_date.strftime('%Y-%m-%d') if academic_session.start_date else '' }}"></div>
                <div class="form-group"><label class="form-label">End Date</label><input type="date" name="end_date" class="form-control" value="{{ academic_session.end_date.strftime('%Y-%m-%d') if academic_session.end_date else '' }}"></div>
            </div>
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                <a href="{{ url_for('academics.sessions_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
