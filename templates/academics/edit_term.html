{% extends "base.html" %}
{% block title %}Edit Term - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Edit Term</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit Term: {{ term.full_name }}</h1></div>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Session</label>
                <input type="text" class="form-control" value="{{ term.session.name }}" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Term</label>
                <input type="text" class="form-control" value="{{ term.name }}" disabled>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control" value="{{ term.start_date.strftime('%Y-%m-%d') if term.start_date else '' }}"></div>
                <div class="form-group"><label class="form-label">End Date</label><input type="date" name="end_date" class="form-control" value="{{ term.end_date.strftime('%Y-%m-%d') if term.end_date else '' }}"></div>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" name="regenerate_weeks" id="regenerate_weeks">
                <label for="regenerate_weeks">Regenerate weeks based on new dates</label>
                <small class="text-muted d-block">Warning: This will delete existing weeks and attendance records for this term</small>
            </div>
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
                <a href="{{ url_for('academics.view_term', term_id=term.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
