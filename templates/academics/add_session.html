{% extends "base.html" %}
{% block title %}Add Session - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Add Session</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Add Session</h1></div>
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group"><label class="form-label">Session Name <span class="required">*</span></label><input type="text" name="name" class="form-control" placeholder="e.g., 2024/2025" required></div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Start Date</label><input type="date" name="start_date" class="form-control"></div>
                <div class="form-group"><label class="form-label">End Date</label><input type="date" name="end_date" class="form-control"></div>
            </div>
            <div class="form-check mb-3"><input type="checkbox" name="is_active" id="is_active"><label for="is_active">Set as Active</label></div>
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Create</button>
                <a href="{{ url_for('academics.sessions_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
