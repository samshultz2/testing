{% extends "base.html" %}
{% block title %}Assign Class - {{ app_name }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('users.index') }}">Users</a> / <a href="{{ url_for('users.view_user', user_id=user.id) }}">{{ user.username }}</a> / <span>Assign Class</span>{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="fas fa-chalkboard-teacher"></i> Assign Class to {{ user.full_name or user.username }}</h1></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="form-group"><label class="form-label">Select Class</label>
<select name="assignment_id" class="form-control" required>
<option value="">-- Select Class --</option>
{% for a in assignments %}<option value="{{ a.id }}">{{ a.display_name }}</option>{% endfor %}
</select></div>
<div class="form-group"><label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;"><input type="checkbox" name="is_form_teacher" checked style="width:1.2rem;height:1.2rem;"> <span>Assign as Form Teacher</span></label></div>
<div class="d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Assign</button>
<a href="{{ url_for('users.view_user', user_id=user.id) }}" class="btn btn-secondary">Cancel</a></div>
</form>
</div></div>
{% endblock %}
