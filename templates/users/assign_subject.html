{% extends "base.html" %}
{% block title %}Assign Subject - {{ app_name }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('users.index') }}">Users</a> / <a href="{{ url_for('users.view_user', user_id=user.id) }}">{{ user.username }}</a> / <span>Assign Subject</span>{% endblock %}
{% block content %}
<div class="page-header"><h1><i class="fas fa-book"></i> Assign Subject to {{ user.full_name or user.username }}</h1></div>
<div class="card"><div class="card-body">
<form method="POST">
<div class="form-group"><label class="form-label">Select Class</label>
<select name="assignment_id" class="form-control" required>
<option value="">-- Select Class --</option>
{% for a in assignments %}<option value="{{ a.id }}">{{ a.display_name }}</option>{% endfor %}
</select></div>
<div class="form-group"><label class="form-label">Select Subject</label>
<select name="subject_id" class="form-control" required>
<option value="">-- Select Subject --</option>
{% for s in subjects %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
</select></div>
<div class="d-flex gap-2"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Assign</button>
<a href="{{ url_for('users.view_user', user_id=user.id) }}" class="btn btn-secondary">Cancel</a></div>
</form>
</div></div>
{% endblock %}
