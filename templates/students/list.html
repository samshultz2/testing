{% extends "base.html" %}

{% block title %}Students - {{ app_name }}{% endblock %}

{% block breadcrumb %}
<span>Students</span>
{% endblock %}

{% block extra_css %}
<style>
/* ---- students list (React, scoped .stu-*) ---- */
.stu-toolbar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }

/* Two-pane shell: main list + a right rail on wide screens. */
.stu-shell { display:grid; grid-template-columns:minmax(0,1fr); gap:1rem; align-items:start; }
.stu-main { min-width:0; }
.stu-rail { display:none; }
@media(min-width:1200px){
  .stu-shell { grid-template-columns:minmax(0,1fr) 316px; }
  .stu-rail { display:flex; flex-direction:column; gap:1rem; position:sticky; top:calc(var(--header-height) + .75rem); }
}

/* Filters card */
.stu-filters-head { display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
.stu-filters-title { font-weight:600; font-size:var(--text-sm); display:inline-flex; align-items:center; gap:.45rem; }
.stu-filters-title i { color:var(--primary); }
.stu-clear-link { background:none; border:0; cursor:pointer; color:var(--primary); font-weight:600;
  font-size:var(--text-sm); display:inline-flex; align-items:center; gap:.35rem; padding:.2rem .3rem; border-radius:var(--radius-sm); }
.stu-clear-link:hover { background:var(--primary-light); }
.stu-filters { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.5rem; margin:.75rem 0 0; }
@media(min-width:768px){ .stu-filters{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
.stu-filters .full { grid-column:1/-1; }
.stu-field-wrap { display:flex; flex-direction:column; gap:4px; margin:0; min-width:0; }
.stu-field-wrap .form-control { width:100%; max-width:100%; }
.stu-field-wrap.full { grid-column:1/-1; }
.stu-field-label { font-size:12px; font-weight:600; color:var(--text-secondary); }

/* Search field with an inset magnifier (matches the reference) */
.stu-search { position:relative; display:block; }
.stu-search-ic { position:absolute; left:.85rem; top:50%; transform:translateY(-50%);
  color:var(--text-muted); pointer-events:none; font-size:.9rem; }
.stu-search-input { padding-left:2.3rem; }

/* Row actions — subtle outlined buttons; View carries the theme accent, the
   overflow is a dropdown caret. */
.stu-act { display:inline-flex; align-items:center; gap:.4rem; border:1px solid var(--border-color);
  background:var(--bg-card); color:var(--text-secondary); border-radius:var(--radius-md);
  padding:.34rem .65rem; font-size:.8rem; font-weight:600; line-height:1.2; cursor:pointer;
  text-decoration:none; white-space:nowrap;
  transition:border-color var(--transition),color var(--transition),background var(--transition); }
.stu-act:hover { border-color:var(--gray-300); background:var(--gray-50); color:var(--text-primary); }
.stu-act i { font-size:.85em; }
.stu-act-view { color:var(--primary); border-color:color-mix(in srgb,var(--primary) 32%,var(--border-color)); }
.stu-act-view:hover { color:var(--primary); background:var(--primary-light); border-color:var(--primary); }
.stu-act-caret { padding:.34rem .5rem; }
.stu-act-caret[aria-expanded="true"] { color:var(--primary); border-color:var(--primary); background:var(--primary-light); }
.stu-count { color:var(--text-muted); font-size:.85rem; }
.stu-bulkbar { display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; padding:.5rem .7rem;
  background:var(--gray-50); border:1px solid var(--border-color); border-radius:var(--radius-md); margin-bottom:.75rem; }
.stu-bulkbar .form-control { max-width:100%; }

/* Avatar (photo or initials) */
.stu-av { border-radius:var(--radius-full); object-fit:cover; flex-shrink:0; display:block;
  background:var(--gray-100); border:1px solid var(--border-color); }
.stu-av-ph { display:inline-flex; align-items:center; justify-content:center; font-weight:700;
  font-size:.78rem; color:var(--primary); background:color-mix(in srgb,var(--primary) 14%,var(--bg-card));
  border-color:transparent; letter-spacing:.02em; }

/* Graduate marker badge next to a name */
.stu-grad { margin-left:.4rem; padding:.05rem .35rem; }

/* Desktop table */
.stu-tablecard { padding:0; overflow:hidden; }
.stu-table-wrap { overflow-x:auto; }
.stu-table { margin:0; }
.stu-table td { vertical-align:middle; }
.stu-check-col { width:36px; text-align:center; }
.stu-act-col { width:1%; white-space:nowrap; text-align:right; }
.stu-row-student { display:inline-flex; align-items:center; gap:.6rem; text-decoration:none; color:inherit; min-width:0; }
.stu-row-name { font-weight:600; color:var(--text-primary); display:inline-flex; align-items:center; }
.stu-row-student:hover .stu-row-name { color:var(--primary); }
.stu-row-actions { display:inline-flex; gap:.3rem; justify-content:flex-end; }
tr.is-sel td { background:var(--primary-light); }
@media(max-width:991px){ .stu-tablecard { display:none; } }

/* Mobile cards */
.stu-cards { display:grid; grid-template-columns:minmax(0,1fr); gap:.6rem; }
@media(min-width:640px){ .stu-cards{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(min-width:992px){ .stu-cards{ display:none; } }
.stu-card { display:flex; gap:.7rem; padding:.8rem; background:var(--bg-card);
  border:1px solid var(--border-color); border-radius:var(--radius-lg); box-shadow:var(--shadow-xs); }
.stu-card.is-sel { outline:2px solid var(--primary); outline-offset:-1px; }
.stu-card > .stu-av { width:44px; height:44px; }
.stu-card-main { flex:1; min-width:0; }
.stu-card-head { display:flex; justify-content:space-between; gap:.5rem; align-items:baseline; }
a.stu-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-decoration:none; color:var(--text-primary); display:inline-flex; align-items:center; }
a.stu-name:hover { color:var(--primary); }
.stu-sid { font-size:.72rem; color:var(--text-muted); white-space:nowrap; }
.stu-meta { display:flex; flex-wrap:wrap; gap:.35rem .5rem; margin:.5rem 0; font-size:.8rem; align-items:center; }
.stu-meta-dim { color:var(--text-muted); }
.stu-actions { display:flex; gap:.4rem; align-items:center; margin-top:.55rem; }
.stu-actions .stu-act { flex:1; justify-content:center; }
.stu-actions .stu-menu-wrap { flex:0 0 auto; }

/* Gender badges — tinted, theme-aware (categorical accents) */
.badge-male{ background:color-mix(in srgb,#3b82f6 14%,var(--bg-card)); color:#2563eb; }
.badge-female{ background:color-mix(in srgb,#f43f5e 14%,var(--bg-card)); color:#e11d64; }

/* Recently-viewed strip (shown until the rail takes over ≥1200px) */
.stu-recent-mobile { margin-bottom:1rem; }
@media(min-width:1200px){ .stu-recent-mobile { display:none; } }
.stu-recent-head { font-size:var(--text-xs); font-weight:600; color:var(--text-muted); text-transform:uppercase;
  letter-spacing:.03em; margin-bottom:.5rem; display:flex; align-items:center; gap:.4rem; }
.stu-recent-strip { display:flex; gap:.75rem; overflow-x:auto; padding-bottom:.25rem; }
.stu-recent-chip { flex:0 0 auto; width:76px; display:flex; flex-direction:column; align-items:center; gap:.25rem;
  text-decoration:none; color:inherit; text-align:center; }
.stu-recent-chip .stu-av-ph { width:48px; height:48px; font-size:.95rem; }
.stu-recent-name { font-size:.72rem; font-weight:600; max-width:76px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stu-recent-id { font-size:.66rem; color:var(--text-muted); }

/* Right rail cards */
.stu-rail-card .card-header h3 { font-size:var(--text-sm); }
.stu-rail-recent { display:flex; flex-direction:column; gap:.05rem; padding:.4rem .5rem; }
.stu-rr-item { display:flex; align-items:baseline; justify-content:space-between; gap:.6rem;
  padding:.45rem .5rem; border-radius:var(--radius-md); text-decoration:none; color:inherit; }
.stu-rr-item:hover { background:var(--gray-50); }
.stu-rr-name { font-size:.82rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.stu-rr-item:hover .stu-rr-name { color:var(--primary); }
.stu-rr-id { font-size:.7rem; color:var(--text-muted); white-space:nowrap; flex-shrink:0; }
.stu-sum-grid { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.stu-sum { border:1px solid var(--border-color); border-radius:var(--radius-md); padding:.65rem .7rem; background:var(--gray-50); }
.stu-sum-v { display:block; font-size:1.55rem; font-weight:800; font-family:var(--font-display); line-height:1; font-variant-numeric:tabular-nums; color:var(--text-primary); }
.stu-sum-l { display:block; font-size:.72rem; color:var(--text-muted); margin-top:.25rem; }
.stu-sum-total { background:color-mix(in srgb,var(--primary) 8%,var(--bg-card)); border-color:color-mix(in srgb,var(--primary) 30%,var(--border-color)); }
.stu-sum-total .stu-sum-v { color:var(--primary); }

/* Gender cell — coloured mars/venus glyph + label (matches the reference) */
.stu-gender { display:inline-flex; align-items:center; gap:.35rem; font-weight:600; white-space:nowrap; }
.stu-gender.is-m { color:#2563eb; } .stu-gender.is-f { color:#e11d64; }

/* File-type accents on the quick-export buttons (universally recognised) */
.stu-x-excel { color:#16a34a; } .stu-x-pdf { color:#dc2626; }
.stu-quick-export { display:flex; flex-direction:column; gap:.45rem; }
.stu-quick-export .btn { width:100%; justify-content:center; }
.stu-tips .card-body { background:color-mix(in srgb,var(--accent) 8%,var(--bg-card)); border-radius:var(--radius-lg); }
.stu-tips-head { font-weight:600; font-size:var(--text-sm); display:flex; align-items:center; gap:.45rem; margin-bottom:.35rem; }
.stu-tips-head i { color:var(--accent); }
.stu-modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:1000; display:flex;
  align-items:flex-start; justify-content:center; padding:5vh 1rem; overflow-y:auto; }
.stu-modal { background:var(--bg-card,#fff); border-radius:12px; width:100%; max-width:560px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.stu-modal h3 { margin:0; font-size:1.05rem; }
.stu-modal-sec { padding:.5rem 1.25rem; }
.stu-field-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.35rem; }
.stu-field { display:flex; gap:.5rem; align-items:center; padding:.4rem .5rem; border:1px solid var(--border-color); border-radius:6px; font-size:.85rem; }
.stu-fmt { display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
.stu-fmt button { padding:.6rem; border:2px solid var(--border-color); border-radius:8px; background:var(--bg-card); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.25rem; font-size:.75rem; }
.stu-fmt button.sel { border-color:var(--primary); }
.stu-spinner { width:18px; height:18px; border:3px solid var(--gray-200,var(--border-color)); border-top-color:var(--primary,#2563eb); border-radius:50%; animation:stu-spin .7s linear infinite; display:inline-block; }
@keyframes stu-spin { to { transform:rotate(360deg); } }

/* ===== Export dialog (frontend/src/students/ExportModal.jsx) =====
   Every colour is a theme variable, so it follows the user's theme. */
.sx-backdrop { padding:3vh 1rem !important; align-items:center !important; }
.sx-dlg { max-width:1140px !important; height:min(900px, 94vh); max-height:94vh !important; border-radius:20px !important;
  display:grid !important; grid-template-rows:auto minmax(0,1fr) auto; color:var(--text-primary); }
.sx-hd { display:flex; align-items:center; gap:14px; padding:18px 24px; border-bottom:1px solid var(--border-color); }
.sx-hd-ic { width:42px; height:42px; border-radius:12px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }
.sx-hd-t { min-width:0; }
.sx-hd h3 { margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-.01em; }
.sx-hd-s { font-size:.84rem; color:var(--text-muted); margin-top:2px; }
.sx-x { margin-left:auto; width:36px; height:36px; border-radius:10px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-muted); cursor:pointer; flex:none; }
.sx-x:hover { color:var(--text-primary); border-color:var(--text-muted); }
.sx-main { position:relative; display:grid; grid-template-columns:minmax(0,1fr) 360px; min-height:0; }
.sx-left { padding:4px 24px 16px; overflow-y:auto; overscroll-behavior:contain; }
.sx-right { background:var(--gray-50); border-left:1px solid var(--border-color); padding:18px 20px; overflow-y:auto; }
.sx-sec { padding:13px 0; border-bottom:1px solid var(--border-light); }
.sx-sec:last-of-type { border-bottom:none; }
.sx-st { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.sx-st b { font-size:.93rem; }
.sx-n { width:22px; height:22px; border-radius:50%; background:var(--text-primary); color:var(--bg-card); font-size:.72rem; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex:none; }
.sx-hint { font-size:.76rem; color:var(--text-muted); }
.sx-r { margin-left:auto; }
.sx-seg { display:inline-flex; background:var(--gray-100); border:1px solid var(--border-color); border-radius:12px; padding:3px; gap:3px; flex-wrap:wrap; }
.sx-seg button { border:none; background:transparent; padding:6px 13px; border-radius:9px; font-size:.82rem; font-weight:600; color:var(--text-secondary); cursor:pointer; }
.sx-seg button.on { background:var(--bg-card); color:var(--text-primary); box-shadow:0 1px 3px rgba(0,0,0,.14); }
.sx-seg .sx-c { color:var(--text-muted); font-weight:500; margin-left:4px; }
.sx-sec > .sx-hint { margin-left:10px; }
.sx-presets { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
.sx-preset { border:1px solid var(--border-color); border-radius:11px; padding:6px 11px; font-size:.8rem; font-weight:600; color:var(--text-secondary); background:var(--bg-card); display:inline-flex; align-items:center; gap:7px; cursor:pointer; }
.sx-preset i { color:var(--text-muted); }
.sx-preset.on { border-color:var(--primary); background:var(--primary-light); color:var(--primary); }
.sx-preset.on i { color:var(--primary); }
.sx-preset.sx-ghost { border-style:dashed; color:var(--primary); }
.sx-saved { padding:0; }
.sx-saved button { border:none; background:none; color:inherit; font:inherit; padding:6px 4px 6px 11px; cursor:pointer; display:inline-flex; gap:7px; align-items:center; }
.sx-saved .sx-del { padding:6px 9px 6px 4px; color:var(--text-muted); }
.sx-name { display:inline-flex; gap:5px; }
.sx-name input { border:1px solid var(--primary); border-radius:10px; padding:5px 9px; font-size:.8rem; width:140px; background:var(--bg-card); color:var(--text-primary); }
.sx-ok { border:none; border-radius:10px; padding:5px 11px; font-weight:700; font-size:.8rem; background:var(--primary); color:var(--bg-card); cursor:pointer; }
.sx-ok:disabled { opacity:.5; cursor:default; }
.sx-groups { display:grid; grid-template-columns:1fr 1.25fr; gap:9px 18px; }
.sx-gl { font-size:.66rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px; }
.sx-pills { display:flex; flex-wrap:wrap; gap:6px; }
.sx-pill { font-size:.76rem; padding:5px 10px; border-radius:999px; border:1px solid var(--border-color); color:var(--text-secondary); background:var(--bg-card); display:inline-flex; gap:6px; align-items:center; cursor:pointer; }
.sx-pill:hover { border-color:var(--text-muted); }
.sx-pill.on { background:var(--text-primary); border-color:var(--text-primary); color:var(--bg-card); }
.sx-pill.on i { font-size:.62rem; }
.sx-order { margin-top:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--gray-50); border:1px dashed var(--border-color); border-radius:12px; padding:7px 10px; }
.sx-lb { font-size:.74rem; color:var(--text-muted); margin-right:2px; }
.sx-chip { font-size:.76rem; background:var(--bg-card); border:1px solid var(--border-color); border-radius:8px; padding:4px 8px; display:inline-flex; align-items:center; gap:6px; cursor:grab; color:var(--text-primary); }
.sx-chip:focus-visible { outline:2px solid var(--primary); outline-offset:1px; }
.sx-chip i { color:var(--text-muted); font-size:.62rem; }
.sx-chip.sx-fixed { cursor:default; color:var(--text-muted); }
.sx-chip button { border:none; background:var(--gray-100); color:var(--text-secondary); border-radius:6px; width:22px; height:22px; font-size:.95rem; line-height:1; cursor:pointer; }
.sx-csv { margin-left:auto; border:none; background:none; color:var(--text-muted); font-size:.78rem; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
.sx-csv.on { color:var(--primary); font-weight:700; }
.sx-formats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.sx-fmt { position:relative; border:1.5px solid var(--border-color); border-radius:14px; padding:10px; display:flex; gap:10px; align-items:flex-start; background:var(--bg-card); text-align:left; cursor:pointer; color:var(--text-primary); }
.sx-fmt:hover { border-color:var(--text-muted); }
.sx-fmt b { font-size:.86rem; display:block; }
.sx-fmt small { display:block; font-size:.72rem; color:var(--text-muted); margin-top:2px; line-height:1.35; }
.sx-fmt.on { border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-alpha); }
.sx-fmt.on::after { content:"\f00c"; font-family:"Font Awesome 6 Free"; font-weight:900; position:absolute; top:8px; right:9px; width:18px; height:18px; border-radius:50%; background:var(--primary); color:var(--bg-card); font-size:.55rem; display:flex; align-items:center; justify-content:center; }
.sx-fi { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; flex:none; }
.sx-fi-pdf { background:rgba(220,38,38,.12); color:#dc2626; }
.sx-fi-xls { background:rgba(22,163,74,.13); color:#16a34a; }
.sx-fi-doc { background:rgba(37,99,235,.12); color:#2563eb; }
.sx-fi-img { background:rgba(124,58,237,.13); color:#7c3aed; }
.sx-lay { display:flex; gap:10px 14px; align-items:center; flex-wrap:wrap; }
.sx-lay.off { opacity:.45; pointer-events:none; }
.sx-k { font-size:.8rem; font-weight:600; color:var(--text-secondary); }
.sx-lay .sx-k + .sx-seg + .sx-k { margin-left:10px; }
.sx-toggles { display:flex; gap:10px 20px; margin-top:11px; flex-wrap:wrap; }
.sx-tog { display:inline-flex; align-items:center; gap:8px; font-size:.82rem; color:var(--text-secondary); cursor:pointer; margin:0; }
.sx-tog input { position:absolute; opacity:0; width:1px; height:1px; }
.sx-sw { width:34px; height:20px; border-radius:999px; background:var(--gray-300); position:relative; flex:none; transition:background .15s; }
.sx-sw::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:left .15s; }
.sx-tog input:checked + .sx-sw { background:var(--primary); }
.sx-tog input:checked + .sx-sw::after { left:16px; }
.sx-tog input:focus-visible + .sx-sw { outline:2px solid var(--primary); outline-offset:2px; }
.sx-row2 { display:grid; grid-template-columns:1fr 1.4fr; gap:12px; margin-top:11px; }
.sx-inp { border:1px solid var(--border-color); border-radius:10px; padding:6px 12px; margin:0; background:var(--bg-card); }
.sx-inp:focus-within { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-alpha); }
.sx-inp span { font-size:.64rem; color:var(--text-muted); font-weight:700; letter-spacing:.07em; text-transform:uppercase; display:block; }
.sx-inp input { border:none; outline:none; width:100%; font-size:.86rem; padding:2px 0; background:transparent; color:var(--text-primary); }
.sx-inp input::placeholder { color:var(--text-muted); opacity:.85; }
.sx-pv { display:flex; flex-direction:column; gap:12px; }
.sx-pv-h { display:flex; justify-content:space-between; align-items:center; }
.sx-pv-h b { font-size:.88rem; }
.sx-pv-h span { font-size:.76rem; color:var(--text-muted); }
.sx-paper { position:relative; background:#fff; border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.16); overflow:hidden; border:1px solid var(--border-color); min-height:200px; }
.sx-paper img { display:block; width:100%; }
.sx-pv-load { position:absolute; inset:auto 8px 8px auto; background:rgba(15,23,42,.78); color:#fff; font-size:.72rem; padding:4px 9px; border-radius:999px; }
.sx-pv-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:200px; color:#64748b; font-size:.82rem; }
.sx-pv-empty i { font-size:1.4rem; }
.sx-pages { display:flex; justify-content:center; align-items:center; gap:6px; }
.sx-pages i { width:7px; height:7px; border-radius:50%; background:var(--gray-300); display:block; }
.sx-pages i.on { background:var(--primary); width:18px; border-radius:4px; }
.sx-pages button { border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-secondary); width:26px; height:26px; border-radius:8px; font-size:.7rem; cursor:pointer; }
.sx-pages button:disabled { opacity:.4; cursor:default; }
.sx-note { font-size:.76rem; color:var(--text-muted); line-height:1.45; background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:9px 12px; margin:0; }
.sx-note i { color:var(--primary); }
.sx-sheet { background:var(--bg-card); border:1px solid var(--border-color); border-radius:10px; overflow:hidden; font-size:.7rem; }
.sx-sheet-row { display:flex; border-bottom:1px solid var(--border-light); }
.sx-sheet-row span { flex:1; min-width:0; padding:5px 6px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; border-right:1px solid var(--border-light); }
.sx-sheet-row span:first-child { flex:0 0 22px; color:var(--text-muted); }
.sx-sheet-row span i { display:block; height:7px; border-radius:4px; background:var(--gray-200); margin-top:3px; }
.sx-sheet-h span { background:var(--primary); color:var(--bg-card); font-weight:700; }
.sx-sheet .sx-note { border:none; border-radius:0; }
.sx-ft { display:flex; align-items:center; gap:10px; padding:13px 24px; border-top:1px solid var(--border-color); background:var(--bg-card); }
.sx-sum { display:flex; gap:7px; flex-wrap:wrap; margin-right:auto; }
.sx-sum span { font-size:.76rem; background:var(--gray-50); border:1px solid var(--border-color); border-radius:999px; padding:4px 10px; color:var(--text-secondary); }
.sx-sum span b { color:var(--text-primary); }
.sx-ft .btn { margin:0; border-radius:12px; padding:.65rem 1.1rem; font-weight:700; }
.sx-pvrow, .sx-pv-close { display:none; }
@media (max-width:860px) {
  .sx-backdrop { padding:0 !important; align-items:flex-end !important; }
  .sx-dlg { height:96vh; max-height:96vh !important; border-radius:22px 22px 0 0 !important; }
  .sx-hd { padding:12px 16px; }
  .sx-hd-ic { display:none; }
  .sx-main { grid-template-columns:minmax(0,1fr); }
  .sx-left { padding:0 16px 12px; }
  .sx-right { display:none; }
  .sx-right.open { display:block; position:absolute; inset:0; z-index:5; border:none; }
  .sx-pv-close { display:inline-flex; gap:8px; align-items:center; margin-bottom:12px; border:1px solid var(--border-color); background:var(--bg-card); color:var(--text-primary); border-radius:10px; padding:7px 12px; font-weight:600; }
  .sx-groups { grid-template-columns:1fr; }
  .sx-formats { grid-template-columns:1fr 1fr; }
  .sx-row2 { grid-template-columns:1fr; }
  .sx-presets { flex-wrap:nowrap; overflow-x:auto; padding-bottom:3px; scrollbar-width:none; }
  .sx-preset { flex:none; }
  .sx-r { margin-left:0; width:100%; }
  .sx-sec > .sx-hint { display:block; margin:7px 0 0; }
  .sx-pvrow { display:flex; gap:10px; align-items:center; width:100%; margin-top:6px; background:var(--gray-50); border:1px solid var(--border-color); border-radius:13px; padding:8px; text-align:left; color:var(--text-secondary); font-size:.78rem; }
  .sx-pvrow img { width:58px; border-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,.18); background:#fff; }
  .sx-pvrow-ic { width:58px; height:58px; border-radius:8px; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; }
  .sx-pvrow b { display:block; color:var(--text-primary); font-size:.85rem; }
  .sx-go { margin-left:auto; color:var(--primary); font-weight:700; white-space:nowrap; }
  .sx-ft { flex-wrap:wrap; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .sx-sum { width:100%; justify-content:center; margin:0 0 2px; }
  .sx-sum span { border:none; background:none; padding:0 2px; }
  .sx-cancel { display:none; }
  .sx-dl { flex:1; justify-content:center; padding:.85rem !important; font-size:1rem; }
}

/* =====================================================================
   Students v2 — laptop: one header line, a search + filter bar, then a
   full-width table. Phone: large title, sticky search, filter sheet,
   native list rows, Select mode with a docked action bar, add FAB.
   ===================================================================== */
.sl{display:flex;flex-direction:column;gap:.85rem;min-width:0}
.sl *{min-width:0}
.sl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:.75rem 1rem;flex-wrap:wrap}
.sl-title h1{margin:0;font-size:1.65rem;font-weight:800;letter-spacing:-.02em;font-family:var(--font-display)}
.sl-title p{margin:.2rem 0 0;color:var(--text-muted);font-size:.86rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.sl-title p b{color:var(--text-primary)}
.sl-dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
.sl-m{color:#3b82f6}.sl-f{color:#ec4899}
.sl-actions{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.sl-actions .btn{display:inline-flex;align-items:center;gap:.45rem}
.sl-caret{font-size:.65rem;opacity:.6}
.sl-more{padding-left:.7rem;padding-right:.7rem}
.sl-menu{position:relative}
.sl-menu-pop{position:absolute;top:calc(100% + 6px);z-index:60;min-width:220px;background:var(--bg-card);border:1px solid var(--border-color);
  border-radius:12px;box-shadow:0 16px 40px -12px rgba(15,23,42,.28);padding:.3rem;display:flex;flex-direction:column}
.sl-menu-pop.right{right:0}.sl-menu-pop.left{left:0}
.sl-menu-pop a,.sl-menu-pop button{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border-radius:8px;border:0;background:none;
  font:inherit;font-size:.86rem;color:var(--text-primary);text-decoration:none;cursor:pointer;text-align:left;white-space:nowrap}
.sl-menu-pop a:hover,.sl-menu-pop button:hover{background:var(--gray-50,#f1f5f9)}
.sl-menu-pop i{width:16px;text-align:center;color:var(--text-muted)}
.sl-menu-pop .danger,.sl-menu-pop .danger i{color:var(--danger,#dc2626)}
/* search bar */
.sl-bar{display:flex;gap:.5rem;align-items:center;padding:.55rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;box-shadow:var(--shadow-xs)}
.sl-bar > .form-control{width:auto;flex:0 1 170px}
.sl-search{flex:1 1 320px;display:flex;align-items:center;gap:.55rem;padding:0 .8rem;height:40px;border-radius:10px;background:var(--gray-50,#f1f5f9);border:1px solid transparent}
.sl-search:focus-within{border-color:var(--primary);background:var(--bg-card)}
.sl-search i{color:var(--text-muted)}
.sl-search input{flex:1;border:0;background:none;outline:none;font:inherit;font-size:.92rem;color:var(--text-primary);height:100%}
.sl-spin{color:var(--primary) !important}
.sl-filter-btn{display:inline-flex;align-items:center;gap:.45rem;height:40px;padding:0 .85rem;border-radius:10px;border:1px solid var(--border-color);
  background:var(--bg-card);color:var(--text-primary);font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;white-space:nowrap}
.sl-filter-btn.on{border-color:var(--primary);color:var(--primary)}
.sl-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:#fff;font-size:.68rem;display:inline-grid;place-items:center}
.sl-panel{padding:.9rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;margin-top:-.4rem}
.sl-filter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.65rem .8rem}
.sl-filter-grid .stu-field-wrap{display:flex;flex-direction:column;gap:.25rem}
.sl-filter-grid .stu-field-label{font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em}
/* chips */
.sl-chips{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.sl-chip{display:inline-flex;align-items:center;gap:.4rem;font:inherit;font-size:.78rem;font-weight:600;padding:.28rem .65rem;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);background:color-mix(in srgb,var(--primary) 8%,var(--bg-card));color:var(--primary);cursor:pointer}
.sl-chip i{font-size:.7rem;opacity:.7}
.sl-chip.saved{border-color:var(--border-color);background:var(--bg-card);color:var(--text-primary);padding:0}
.sl-chip.saved button{border:0;background:none;font:inherit;color:inherit;padding:.28rem .5rem;cursor:pointer}
.sl-link{border:0;background:none;font:inherit;font-size:.78rem;font-weight:600;color:var(--primary);cursor:pointer;padding:.25rem .35rem}
/* recent */
.sl-recent{display:flex;gap:.4rem;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:.1rem}
.sl-recent::-webkit-scrollbar{display:none}
.sl-recent-l{font-size:.74rem;font-weight:700;color:var(--text-muted);white-space:nowrap;margin-right:.2rem}
.sl-recent-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .65rem .2rem .2rem;border-radius:999px;border:1px solid var(--border-color);
  background:var(--bg-card);text-decoration:none;color:var(--text-primary);font-size:.78rem;white-space:nowrap;flex:0 0 auto}
/* selection */
.sl-selbar{background:var(--bg-card);border:1px solid color-mix(in srgb,var(--primary) 35%,var(--border-color));border-radius:14px;padding:.55rem .7rem;
  box-shadow:0 10px 30px -18px color-mix(in srgb,var(--primary) 60%,#000);position:sticky;top:calc(var(--header-height,60px) + 8px);z-index:30}
.sl-selbar-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.sl-selbar-acts{margin-left:auto;display:flex;gap:.35rem;flex-wrap:wrap}
.sl-selbar-acts .btn{display:inline-flex;align-items:center;gap:.3rem}
.sl-bulk{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--border-color)}
.sl-bulk-f{display:inline-flex;gap:.3rem;align-items:center}
.sl-bulk-f .form-control{width:auto;max-width:180px}
.sl-bulk-f.wide .form-control{max-width:200px}
/* table */
.sl-table-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-xs)}
.sl-table-card.is-loading,.sl-list.is-loading{opacity:.6;transition:opacity .15s}
.sl-table{width:100%;border-collapse:collapse;font-size:.87rem}
.sl-table th{position:static;background:var(--gray-50,#f8fafc);text-align:left;font-size:.7rem;font-weight:700;
  letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);padding:.6rem .75rem;border-bottom:1px solid var(--border-color);white-space:nowrap}
.sl-table td{padding:.45rem .75rem;border-bottom:1px solid var(--border-light,var(--border-color));vertical-align:middle;white-space:nowrap}
.sl-table tr:last-child td{border-bottom:0}
.sl-table tbody tr:hover{background:var(--gray-50,#f8fafc)}
.sl-table tr.is-sel{background:color-mix(in srgb,var(--primary) 7%,var(--bg-card))}
.sl-table .num{text-align:right}
.sl-check{width:36px}
.sl-who{display:flex;align-items:center;gap:.65rem;text-decoration:none;color:inherit}
.sl-who span{display:flex;flex-direction:column;line-height:1.25}
.sl-who b{font-weight:600;display:inline-flex;align-items:center;gap:.35rem}
.sl-who small{color:var(--text-muted);font-size:.74rem}
.sl-who:hover b{color:var(--primary)}
.sl-grad{color:var(--success,#16a34a);font-size:.75rem;margin-left:.3rem}
.sl-med{color:var(--danger,#dc2626);font-size:.75rem;margin-left:.35rem;cursor:help}
.sl-medtx{display:block;color:var(--danger,#dc2626)!important;max-width:28rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-tag{font-size:.74rem;font-weight:600;padding:.12rem .5rem;border-radius:6px;background:color-mix(in srgb,var(--info,#2563eb) 10%,transparent);color:var(--info,#2563eb)}
.sl-gender{font-size:.82rem;font-weight:600}.sl-gender.m{color:#3b82f6}.sl-gender.f{color:#ec4899}
.sl-acts{text-align:right;width:1%}
.sl-acts > *{display:inline-flex;vertical-align:middle}
.sl-rowbtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:none;color:var(--text-muted);cursor:pointer;text-decoration:none}
.sl-rowbtn:hover{background:var(--gray-100,#eef2f6);color:var(--primary)}
.sl-foot{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.sl-foot .pagination,.sl-foot nav{margin:0}
.sl-count{font-size:.8rem;color:var(--text-muted)}
/* list rows (phone) */
.sl-list{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px}
.sl-list > :last-child{border-radius:0 0 16px 16px}
.sl-row{display:flex;align-items:center;gap:.65rem;padding:.5rem .35rem .5rem .8rem;min-height:60px;position:relative}
.sl-row + .sl-row::before{content:"";position:absolute;top:0;left:calc(.8rem + 42px + .7rem);right:0;border-top:1px solid var(--border-light,var(--border-color))}
.sl-letter{position:sticky;top:calc(var(--header-height,60px) + 58px);z-index:2;padding:.3rem .9rem;font-size:.72rem;font-weight:800;letter-spacing:.06em;
  color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--bg-card));border-top:1px solid var(--border-light,var(--border-color))}
.sl-letter:first-child{border-top:0;border-radius:16px 16px 0 0}
.sl-g{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--border-color);margin-right:.4rem;vertical-align:1px}
.sl-g.m{background:#3b82f6}.sl-g.f{background:#ec4899}
.sl-sep{margin:0 .3rem;opacity:.5}
.stu-av-ph.tinted{font-weight:700;letter-spacing:.02em}
.sl-row.is-sel{background:color-mix(in srgb,var(--primary) 8%,var(--bg-card))}
.sl-row input[type=checkbox]{width:20px;height:20px;flex:0 0 auto}
.sl-row-all{font-size:.85rem;font-weight:600;min-height:48px}
.sl-row-main{flex:1;display:flex;align-items:center;gap:.7rem;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
.sl-row-main:active{opacity:.7}
.sl-row-text{flex:1;display:flex;flex-direction:column;line-height:1.3}
.sl-row-text b{font-weight:600;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.sl-row-text small{color:var(--text-muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-skel{pointer-events:none}
.sl-iconbtn{height:38px;min-width:38px;padding:0 .7rem;border-radius:12px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-primary);
  font:inherit;font-size:.85rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;cursor:pointer}
.sl-iconbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.sl-fab{position:fixed;right:18px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:950;width:56px;height:56px;border-radius:18px;
  display:grid;place-items:center;background:var(--primary);color:#fff;font-size:1.3rem;text-decoration:none;
  box-shadow:0 12px 26px -8px color-mix(in srgb,var(--primary) 70%,#000)}
.sl-fab:active{transform:scale(.94)}
/* bottom sheet (phone filters) */
.sl-sheet-bg{position:fixed;inset:0;z-index:2000;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;animation:sl-fade .15s ease}
.sl-sheet{width:100%;max-height:86vh;overflow-y:auto;background:var(--bg-card);border-radius:20px 20px 0 0;padding:.4rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));
  animation:sl-up .2s ease}
.sl-sheet-grip{width:38px;height:5px;border-radius:3px;background:var(--border-color);margin:.3rem auto .7rem}
.sl-sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem;font-size:1.05rem}
.sl-sheet .sl-filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.sl-sheet-done{width:100%;margin-top:1rem;height:46px;border-radius:12px;font-weight:700}
@keyframes sl-up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes sl-fade{from{opacity:0}to{opacity:1}}
@media (max-width:759px){
  .sl{gap:.7rem}
  .sl-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:.15rem .5rem}
  .sl-title{display:contents}
  .sl-title h1{font-size:1.75rem;grid-column:1;grid-row:1}
  .sl-actions{grid-column:2;grid-row:1;flex-wrap:nowrap;gap:.3rem}
  .sl-title p{grid-column:1 / -1;grid-row:2;font-size:.8rem;margin:0}
  .sl-title p > *{flex:0 0 auto}
  .sl-iconbtn{height:36px;min-width:36px;padding:0 .6rem;border-radius:11px}
  .sl-bar{position:sticky;top:var(--header-height,60px);z-index:40;margin:0 calc(-1 * var(--sp-4,16px));padding:.5rem var(--sp-4,16px);border-radius:0;
    border-left:0;border-right:0;box-shadow:none;background:color-mix(in srgb,var(--bg-body) 97%,transparent);
    -webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px)}
  .sl-search{height:42px;border-radius:12px;background:var(--bg-card);border-color:var(--border-color)}
  .sl-search input{font-size:16px}       /* no iOS zoom on focus */
  .sl-filter-btn{height:42px;width:46px;justify-content:center;padding:0;border-radius:12px;position:relative}
  .sl-filter-btn .sl-badge{position:absolute;top:-5px;right:-5px}
  .sl-chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .sl-chips::-webkit-scrollbar{display:none}
  .sl-chips > *{flex:0 0 auto}
  .sl-list{border-radius:16px}
  .sl-selbar{position:fixed;left:8px;right:8px;top:auto;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:960;border-radius:16px}
  .sl-selbar-acts .btn span{display:none}
  .sl-selbar-acts .btn{width:38px;height:36px;justify-content:center;padding:0}
  .sl-bulk{max-height:40vh;overflow-y:auto}
  .sl-bulk-f{width:100%}.sl-bulk-f .form-control{max-width:none;flex:1}
  .sl.has-sel{padding-bottom:5rem}
  .sl-foot{justify-content:center}
  .sl-count{width:100%;text-align:center}
  .sl-menu-pop{min-width:200px}
}
</style>
{% endblock %}

{% block content %}
<div id="students-app"><p class="text-muted" style="padding:2rem 0"><span class="stu-spinner"></span> Loading students…</p></div>
<script type="application/json" id="students-data">{{ students_json|tojson }}</script>
<script src="{{ bundle_url('js/react/students-app.js') }}" defer></script>
{% endblock %}
