{% extends "base.html" %}
{% block title %}Deleted Students - {{ app_name }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('main.students_list') }}">Students</a> / <span>Deleted</span>{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ bundle_url('css/results-kit.css') }}">
<style>
.tr{max-width:1100px}
.tr-grow{flex:1}
.tr-card{display:flex;flex-direction:column}
.tr-tools{display:flex;flex-direction:column;gap:.7rem;padding:1rem 1.1rem;border-bottom:1px solid var(--border-color)}
.tr-search{position:relative;display:block}
.tr-search>i{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;pointer-events:none}
.tr-search input{width:100%;height:44px;border:1.5px solid var(--border-color);border-radius:12px;padding:0 2.6rem 0 2.4rem;font:inherit;font-size:.92rem;background:var(--bg-card);color:var(--text-primary)}
.tr-search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.tr-search input::-webkit-search-cancel-button{display:none}
.tr-search button{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--text-muted);cursor:pointer}
.tr-search button:hover{background:var(--gray-100)}
.tr-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.tr-row .rs-seg em{font-style:normal;font-size:.72rem;font-weight:700;opacity:.65;margin-left:.1rem}
.tr-sel select{height:38px;border:1.5px solid var(--border-color);border-radius:10px;padding:0 2rem 0 .7rem;font:inherit;font-size:.84rem;font-weight:600;background-color:var(--bg-card);color:var(--text-primary);max-width:200px}
.tr-head{display:flex;align-items:center;gap:.8rem;padding:.6rem 1.1rem;background:var(--gray-50,#f8fafc);border-bottom:1px solid var(--border-color);font-size:.82rem}
.tr-all{display:flex;align-items:center;gap:.45rem;margin:0;font-weight:700;color:var(--text-secondary);cursor:pointer}
.tr-all input,.tr-chk{width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex:none;margin:0}
.tr-count{color:var(--text-muted);font-weight:600}
.tr-link{border:0;background:none;color:var(--primary);font:inherit;font-weight:700;cursor:pointer;padding:0}
.tr-link:hover{text-decoration:underline}
.tr-none{padding:2.4rem 1rem;text-align:center;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:.6rem}
.tr-none i{font-size:1.3rem}
.tr-list{list-style:none;margin:0;padding:0}
.tr-list li{display:flex;align-items:center;gap:.85rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--border-light,var(--border-color))}
.tr-list li:last-child{border-bottom:0}
.tr-list li:hover{background:var(--gray-50,#f8fafc)}
.tr-list li.sel{background:color-mix(in srgb,var(--primary) 7%,var(--bg-card))}
.tr-av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--gray-100);color:var(--text-muted);font-weight:800;font-size:.8rem;filter:grayscale(1);opacity:.85}
.tr-av img{width:100%;height:100%;object-fit:cover}
.tr-who{flex:1;min-width:0;display:flex;flex-direction:column;gap:.12rem}
.tr-who b{font-size:.95rem;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-who small{font-size:.78rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.35rem}
.tr-dim{color:var(--text-muted)}
.tr-g{width:8px;height:8px;border-radius:50%;background:var(--gray-300,#cbd5e1);flex:none}
.tr-g.m{background:#3b82f6}.tr-g.f{background:#ec4899}
.tr-when{color:var(--text-muted)!important}
.tr-when i{font-size:.7rem}
.tr-when.new{color:var(--warning)!important;font-weight:600}
.tr-tag{display:inline-block;margin-left:.45rem;padding:.05rem .45rem;border-radius:999px;font-size:.66rem;font-weight:800;vertical-align:middle;background:color-mix(in srgb,var(--success) 14%,transparent);color:var(--success)}
.tr-acts{display:flex;align-items:center;gap:.4rem;flex:none}
.tr-restore{border-color:color-mix(in srgb,var(--success) 45%,var(--border-color));color:var(--success)}
.tr-restore:hover{background:color-mix(in srgb,var(--success) 10%,var(--bg-card));border-color:var(--success);color:var(--success)}
.tr-purge{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:none;color:var(--text-muted);cursor:pointer}
.tr-purge:hover{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
.tr-purge:disabled,.tr-restore:disabled{opacity:.5;cursor:not-allowed}
.tr-selbar{position:sticky;bottom:1rem;z-index:20;display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem .6rem .9rem;border-radius:14px;background:var(--text-primary,#0f172a);color:var(--bg-card,#fff);box-shadow:0 10px 30px rgba(15,23,42,.25)}
.tr-selbar b{font-size:.9rem}
.tr-selx{width:32px;height:32px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:inherit;cursor:pointer}
.tr-selbar.fixed{position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:960}
@media (max-width:759px){
  .tr.has-bar{padding-bottom:84px}
  /* Compact stat strip: three small tiles in one row. */
  .tr .rs-tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
  .tr .rs-tiles>.rs-tile:last-child:nth-child(odd){grid-column:auto}
  .tr .rs-tile{padding:.55rem .65rem}
  .tr .rs-tile .l{font-size:.6rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .rs-tile .v{font-size:1.2rem}
  .tr .rs-tile .s{display:none}
  .tr-row .rs-seg em{display:none}
  .tr-row .rs-seg button.on em{display:inline}
  .tr-row{display:grid;grid-template-columns:1fr 1fr}
  .tr-row .rs-seg{grid-column:1 / -1}
  .tr-row .tr-sel:first-of-type{grid-column:1 / -1}
  .tr-tools{padding:.85rem .9rem}
  .tr-row{gap:.45rem}
  .tr-row .rs-seg{width:100%}
  .tr-row .rs-seg button{flex:1;justify-content:center;padding:0 .4rem;font-size:.8rem}
  .tr-row .tr-grow{display:none}
  .tr-sel{min-width:0}
  .tr-sel select{width:100%;max-width:none;font-size:.8rem;padding:0 1.6rem 0 .55rem}
  .tr-head{padding:.55rem .9rem}
  .tr-list li{gap:.65rem;padding:.7rem .9rem;align-items:flex-start}
  .tr-av{width:38px;height:38px}
  .tr-chk{margin-top:.6rem}
  .tr-restore span{display:none}
  .tr-restore{width:38px;padding:0}
  .tr-acts{flex-direction:column;gap:.3rem}
  .tr-purge{width:38px}
}
</style>
{% endblock %}

{% block content %}
<div id="student-trash-app"><p class="text-muted" style="padding:2rem 0">Loading…</p></div>
<script type="application/json" id="student-trash-data">{{ trash_json|tojson }}</script>
<script src="{{ bundle_url('js/react/student-trash-app.js') }}" defer></script>
{% endblock %}
