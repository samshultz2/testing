{% extends "base.html" %}
{% block title %}Reports - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Reports</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Reports</h1></div>
<div class="stats-grid">
    <a href="{{ url_for('reports.summary_report') }}" class="stat-card" style="text-decoration: none;"><div class="stat-icon primary"><i class="fas fa-chart-line"></i></div><div class="stat-content"><h3>Summary</h3><p>Overview</p></div></a>
    <a href="{{ url_for('reports.import_students') }}" class="stat-card" style="text-decoration: none;"><div class="stat-icon success"><i class="fas fa-file-import"></i></div><div class="stat-content"><h3>Import</h3><p>From Excel</p></div></a>
    <a href="{{ url_for('reports.export_students') }}" class="stat-card" style="text-decoration: none;"><div class="stat-icon info"><i class="fas fa-file-export"></i></div><div class="stat-content"><h3>Export</h3><p>Students</p></div></a>
    <a href="{{ url_for('reports.export_template') }}" class="stat-card" style="text-decoration: none;"><div class="stat-icon secondary"><i class="fas fa-file-download"></i></div><div class="stat-content"><h3>Template</h3><p>Download</p></div></a>
</div>
{% endblock %}
