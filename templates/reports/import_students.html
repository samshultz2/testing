{% extends "base.html" %}
{% block title %}Import - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Import</span>{% endblock %}
{% block content %}
<div class="page-header"><h1>Import Students</h1></div>
<div class="card">
    <div class="card-body">
        <p class="mb-3">Upload an Excel file (.xlsx) to import students. <a href="{{ url_for('reports.export_template') }}">Download template</a> first.</p>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label">Select File</label>
                <input type="file" name="file" class="form-control" accept=".xlsx,.xls" required>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-upload"></i> Import</button>
        </form>
    </div>
</div>
{% endblock %}
