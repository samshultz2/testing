{% extends "base.html" %}
{% block title %}Add Stream - Generator{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('generator.index') }}">Generator</a> / <a href="{{ url_for('generator.streams_list') }}">Streams</a> / <span>Add</span>{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Stream</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Stream Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Science">
            </div>
            
            <div class="form-group">
                <label class="form-label">Short Name</label>
                <input type="text" name="short_name" class="form-control" placeholder="e.g., SCI" maxlength="10">
            </div>
            
            <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" name="description" class="form-control" placeholder="e.g., Science stream for students pursuing science subjects">
            </div>
            
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save & Assign Subjects</button>
                <a href="{{ url_for('generator.streams_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
