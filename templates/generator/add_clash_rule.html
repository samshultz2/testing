{% extends "base.html" %}
{% block title %}Add Clash Rule - {{ app_name }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('generator.index') }}">Generator</a> / <a href="{{ url_for('generator.clash_rules_list') }}">Clash Rules</a> / <span>Add</span>{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-plus"></i> Add Subject Clash Rule</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Rule Name *</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Geo SSS3 Iris vs Lit SSS1">
            </div>
            
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="2" placeholder="Explain why this rule exists"></textarea>
            </div>
            
            <fieldset style="border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 4px;">
                <legend style="width: auto; padding: 0 0.5rem; font-weight: bold;">Source Subject (to protect)</legend>
                
                <div class="form-group">
                    <label class="form-label">Subject *</label>
                    <select name="source_subject_id" class="form-control" required>
                        <option value="">Select Subject</option>
                        {% for s in subjects %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Class *</label>
                            <select name="source_class_name" class="form-control" required id="sourceClass">
                                <option value="">Select Class</option>
                                {% for c in classes %}
                                <option value="{{ c.class_name }}" data-arms="{{ c.arm_names }}">{{ c.class_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Arm (leave empty for all)</label>
                            <select name="source_arm_name" class="form-control" id="sourceArm">
                                <option value="">All Arms</option>
                            </select>
                        </div>
                    </div>
                </div>
            </fieldset>
            
            <fieldset style="border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 4px;">
                <legend style="width: auto; padding: 0 0.5rem; font-weight: bold;">Target Subject (must not clash with)</legend>
                
                <div class="form-group">
                    <label class="form-label">Subject *</label>
                    <select name="target_subject_id" class="form-control" required>
                        <option value="">Select Subject</option>
                        {% for s in subjects %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Class (leave empty for all)</label>
                            <select name="target_class_name" class="form-control" id="targetClass">
                                <option value="">All Classes</option>
                                {% for c in classes %}
                                <option value="{{ c.class_name }}" data-arms="{{ c.arm_names }}">{{ c.class_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Arm (leave empty for all)</label>
                            <select name="target_arm_name" class="form-control" id="targetArm">
                                <option value="">All Arms</option>
                            </select>
                        </div>
                    </div>
                </div>
            </fieldset>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Rule</button>
                <a href="{{ url_for('generator.clash_rules_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<style>
.row { display: flex; flex-wrap: wrap; margin: 0 -0.5rem; }
.col-md-6 { flex: 0 0 50%; max-width: 50%; padding: 0 0.5rem; }
@media (max-width: 768px) { .col-md-6 { flex: 0 0 100%; max-width: 100%; } }
</style>

<script>
document.getElementById('sourceClass').addEventListener('change', function() {
    const arms = this.options[this.selectedIndex].dataset.arms;
    const armSelect = document.getElementById('sourceArm');
    armSelect.innerHTML = '<option value="">All Arms</option>';
    if (arms) {
        arms.split(',').forEach(arm => {
            armSelect.innerHTML += `<option value="${arm.trim()}">${arm.trim()}</option>`;
        });
    }
});

document.getElementById('targetClass').addEventListener('change', function() {
    const arms = this.options[this.selectedIndex].dataset.arms;
    const armSelect = document.getElementById('targetArm');
    armSelect.innerHTML = '<option value="">All Arms</option>';
    if (arms) {
        arms.split(',').forEach(arm => {
            armSelect.innerHTML += `<option value="${arm.trim()}">${arm.trim()}</option>`;
        });
    }
});
</script>
{% endblock %}
