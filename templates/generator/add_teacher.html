{% extends "base.html" %}
{% block title %}Add Teacher - Generator{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('generator.index') }}">Generator</a> / <a href="{{ url_for('generator.teachers_list') }}">Teachers</a> / <span>Add</span>{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Teacher</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Mr. John Obi">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Staff ID</label>
                    <input type="text" name="staff_id" class="form-control" placeholder="e.g., TCH001">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" placeholder="e.g., 08012345678">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="e.g., john.obi@school.com">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Max Periods Per Day</label>
                    <input type="number" name="max_periods_per_day" class="form-control" value="6" min="1" max="10">
                </div>
                <div class="form-group">
                    <label class="form-label">Max Periods Per Week</label>
                    <input type="number" name="max_periods_per_week" class="form-control" value="30" min="1" max="50">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Preferred Time</label>
                    <select name="preferred_time" class="form-control">
                        <option value="any">Any</option>
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_part_time">
                        <span>Part-time teacher</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Available Days</label>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    {% for day in days %}
                    <label class="checkbox-label">
                        <input type="checkbox" name="available_days[]" value="{{ loop.index0 }}" checked>
                        <span>{{ day }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save & Assign Subjects</button>
                <a href="{{ url_for('generator.teachers_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
