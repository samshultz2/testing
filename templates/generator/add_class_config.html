{% extends "base.html" %}
{% block title %}Add Class - Generator{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('generator.index') }}">Generator</a> / <a href="{{ url_for('generator.classes_config') }}">Classes</a> / <span>Add</span>{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Class Configuration</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Class Name <span class="required">*</span></label>
                <input type="text" name="class_name" class="form-control" required placeholder="e.g., SSS1">
            </div>
            
            <div class="form-group">
                <label class="form-label">Number of Arms</label>
                <input type="number" name="num_arms" class="form-control" value="1" min="1" max="10">
            </div>
            
            <div class="form-group">
                <label class="form-label">Arm Names</label>
                <input type="text" name="arm_names" class="form-control" placeholder="e.g., Iris, Rose, Lily, Tulip">
                <span class="form-hint">Comma-separated list of arm names</span>
            </div>
            
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="has_streams">
                    <span>This class has streams (Science/Arts/Commercial)</span>
                </label>
                <span class="form-hint">If checked, you'll need to assign streams to each arm</span>
            </div>
            
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                <a href="{{ url_for('generator.classes_config') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
