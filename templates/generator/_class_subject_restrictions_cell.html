                        <td style="white-space: nowrap;">
                            <label class="restriction-chip" title="Never schedule as period 1{% if item.global_not_first %} (already off period 1 school-wide for this subject; checking this has no extra effect){% endif %}">
                                <input type="checkbox" name="not_first_{{ item.subject.id }}" {% if item.not_first_period %}checked{% endif %}> 1st{% if item.global_not_first %}*{% endif %}

                            <label class="restriction-chip" title="Never schedule as the last period of the day{% if item.global_not_last %} (already off the last period school-wide for this subject; checking this has no extra effect){% endif %}">

                                <input type="checkbox" name="avoid_morning_{{ item.subject.id }}" {% if item.avoid_morning %}checked{% endif %}> AM

                            <label class="restriction-chip" title="Never schedule after the break">
