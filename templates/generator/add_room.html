{% extends "base.html" %}
{% block title %}Add Room - Generator{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('generator.index') }}">Generator</a> / <a href="{{ url_for('generator.rooms_list') }}">Rooms</a> / <span>Add</span>{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Add Room</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Room Name <span class="required">*</span></label>
                <input type="text" name="name" class="form-control" required placeholder="e.g., Physics Lab">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Short Name</label>
                    <input type="text" name="short_name" class="form-control" placeholder="e.g., PHY LAB" maxlength="10">
                </div>
                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select name="room_type" class="form-control">
                        <option value="classroom">Classroom</option>
                        <option value="lab">Laboratory</option>
                        <option value="hall">Hall</option>
                        <option value="field">Field/Court</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Capacity</label>
                <input type="number" name="capacity" class="form-control" placeholder="e.g., 40" style="width: 150px;">
            </div>
            <div class="page-header-actions">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save</button>
                <a href="{{ url_for('generator.rooms_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
