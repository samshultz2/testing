<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening support session…</title>
<!-- Hand off to the school's own host with a top-level GET navigation. This is
     the robust way to cross to another subdomain: the session cookie is set on
     the tenant host by that GET, and if the host is unreachable the operator
     still sees this page (and the exact URL) instead of a silent blank. -->
<meta http-equiv="refresh" content="1;url={{ link }}">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0f172a;color:#e2e8f0;display:grid;place-items:center;min-height:100vh;padding:24px}
  .card{max-width:480px;text-align:center;background:#1e293b;border:1px solid #334155;
    border-radius:16px;padding:34px 30px}
  .ic{width:56px;height:56px;border-radius:14px;background:#78350f;color:#fff;display:grid;
    place-items:center;font-size:24px;margin:0 auto 16px}
  h1{font-size:20px;margin:0 0 8px} p{color:#94a3b8;line-height:1.6;margin:0 0 18px}
  .go{display:inline-block;background:#f59e0b;color:#111;font-weight:700;text-decoration:none;
    padding:11px 20px;border-radius:10px}
  .url{margin-top:16px;font-size:12px;color:#64748b;word-break:break-all}
  .spin{width:18px;height:18px;border:2px solid #475569;border-top-color:#f59e0b;border-radius:50%;
    display:inline-block;vertical-align:-3px;margin-right:8px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="ic">🕵️</div>
    <h1><span class="spin"></span>Opening support session</h1>
    <p>Handing you over to <b>{{ subdomain }}</b>’s portal as read-only support. This
       should happen automatically — if it doesn’t, use the button below.</p>
    <a class="go" href="{{ link }}">Enter {{ subdomain }} portal</a>
    <div class="url">{{ link }}</div>
  </div>
</body>
</html>
