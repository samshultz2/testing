{% set ep = request.endpoint %}
<div class="fin-tabs">
    <a href="{{ url_for('cbt.dashboard') }}" class="fin-tab {% if ep == 'cbt.dashboard' %}active{% endif %}"><i class="fas fa-chart-pie"></i> Overview</a>
    <a href="{{ url_for('cbt.add_exam') }}" class="fin-tab {% if ep in ['cbt.add_exam','cbt.exam_detail','cbt.edit_exam','cbt.results'] %}active{% endif %}"><i class="fas fa-circle-plus"></i> Exams</a>
    <a href="{{ url_for('cbt.bank') }}" class="fin-tab {% if ep in ['cbt.bank','cbt.bank_import'] %}active{% endif %}"><i class="fas fa-layer-group"></i> Question Bank</a>
    <a href="{{ url_for('cbt.passwords') }}" class="fin-tab {% if ep == 'cbt.passwords' %}active{% endif %}"><i class="fas fa-key"></i> Student Passwords</a>
    <a href="{{ url_for('cbt.settings') }}" class="fin-tab {% if ep == 'cbt.settings' %}active{% endif %}"><i class="fas fa-user-shield"></i> Supervisor</a>
    <a href="{{ url_for('cbt.lab_setup') }}" class="fin-tab {% if ep == 'cbt.lab_setup' %}active{% endif %}"><i class="fas fa-desktop"></i> Lab Setup</a>
    <a href="{{ url_for('cbt_portal.login') }}" target="_blank" class="fin-tab"><i class="fas fa-up-right-from-square"></i> Test Portal</a>
</div>
<style>
.fin-tabs{display:flex;gap:.35rem;overflow-x:auto;margin-bottom:1rem;border-bottom:1px solid var(--border-color);padding-bottom:.1rem;-webkit-overflow-scrolling:touch}
.fin-tab{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem .9rem;white-space:nowrap;font-size:.85rem;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;text-decoration:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.fin-tab i{font-size:.85rem;opacity:.8}
.fin-tab:hover{color:var(--primary);background:var(--gray-50)}
.fin-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
</style>
