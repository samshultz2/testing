{% extends "cbt/portal_base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="portal-card" style="max-width:420px;margin:8vh auto 0;">
    <div style="text-align:center;margin-bottom:1rem;">
        {% if school_brand.logo_url %}
        <img src="{{ school_brand.logo_url }}" alt="{{ school_brand.name }}" style="width:64px;height:64px;border-radius:16px;object-fit:contain;background:#fff;">
        {% else %}
        <span style="display:inline-flex;width:64px;height:64px;border-radius:16px;background:var(--portal-primary);color:#fff;align-items:center;justify-content:center;font-size:1.7rem;"><i class="fas fa-graduation-cap"></i></span>
        {% endif %}
        {% if school_brand.name %}<div style="margin-top:.5rem;font-weight:600;color:var(--portal-ink);">{{ school_brand.name }}</div>{% endif %}
        <h1 style="margin-top:.6rem;">Exam Portal</h1>
        <p class="text-muted" style="margin:0;">Log in with your Student ID and password</p>
    </div>
    <form method="POST" action="{{ url_for('cbt_portal.login') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label class="form-label">Student ID</label><input type="text" name="student_id" class="form-control" placeholder="e.g., STU00001" required autofocus></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-right-to-bracket"></i> Log in</button>
    </form>
</div>
{% endblock %}
