{% extends "cbt/portal_base.html" %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="portal-card" style="max-width:420px;margin:8vh auto 0;">
    <div style="text-align:center;margin-bottom:1rem;">
        <img src="{{ url_for('static', filename='img/logo-mark.svg') }}" alt="" style="width:64px;height:64px;border-radius:16px;">
        <h1 style="margin-top:.6rem;">Test Portal</h1>
        <p class="text-muted" style="margin:0;">Log in with your Student ID and password</p>
    </div>
    <form method="POST" action="{{ url_for('cbt_portal.login') }}">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label class="form-label">Student ID</label><input type="text" name="student_id" class="form-control" placeholder="e.g., STU00001" required autofocus></div>
        <div class="form-group"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-right-to-bracket"></i> Log in</button>
    </form>
</div>
{% endblock %}
