{% extends "cbt/portal_base.html" %}
{% block title %}Submitting…{% endblock %}
{% block content %}
<div class="portal-card" style="max-width:460px;margin:6vh auto 0;text-align:center;">
    <span style="display:inline-flex;width:72px;height:72px;border-radius:50%;background:#eef2ff;color:#4f46e5;align-items:center;justify-content:center;font-size:1.8rem;"><i class="fas fa-spinner fa-spin"></i></span>
    <h1 style="margin-top:.9rem;">Marking your test…</h1>
    <p class="p-muted" style="margin:.2rem 0 0;">{{ exam.title }}{% if exam.subject %} · {{ exam.subject.name }}{% endif %}</p>
    <p style="margin:1rem 0 0;font-size:.92rem;"><i class="fas fa-circle-check" style="color:#16a34a"></i> Your answers are safely saved. This page updates by itself — no need to refresh.</p>
</div>
<script nonce="{{ csp_nonce }}">
  // Poll the result page until grading completes (server redirects/renders the
  // score once the worker finalises, or self-heals after a short grace).
  setTimeout(function () { window.location.reload(); }, 2500);
</script>
{% endblock %}
