{% set ep = request.endpoint %}
<div class="fin-tabs">
    <a href="{{ url_for('comms.dashboard') }}" class="fin-tab {% if ep == 'comms.dashboard' %}active{% endif %}"><i class="fas fa-chart-pie"></i> Overview</a>
    <a href="{{ url_for('comms.compose') }}" class="fin-tab {% if ep == 'comms.compose' %}active{% endif %}"><i class="fas fa-paper-plane"></i> Compose</a>
    <a href="{{ url_for('comms.announcements') }}" class="fin-tab {% if ep == 'comms.announcements' %}active{% endif %}"><i class="fas fa-bullhorn"></i> Announcements</a>
    <a href="{{ url_for('comms.messages_list') }}" class="fin-tab {% if ep in ['comms.messages_list','comms.message_detail'] %}active{% endif %}"><i class="fas fa-clock-rotate-left"></i> History</a>
    <a href="{{ url_for('comms.templates_list') }}" class="fin-tab {% if ep == 'comms.templates_list' %}active{% endif %}"><i class="fas fa-file-lines"></i> Templates</a>
    <a href="{{ url_for('comms.contacts') }}" class="fin-tab {% if ep == 'comms.contacts' %}active{% endif %}"><i class="fas fa-address-book"></i> Contacts</a>
    <a href="{{ url_for('comms.settings') }}" class="fin-tab {% if ep == 'comms.settings' %}active{% endif %}"><i class="fas fa-gear"></i> Settings</a>
</div>
<style>
.fin-tabs{display:flex;gap:.35rem;overflow-x:auto;margin-bottom:1rem;border-bottom:1px solid var(--border-color);padding-bottom:.1rem;-webkit-overflow-scrolling:touch}
.fin-tab{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem .9rem;white-space:nowrap;font-size:.85rem;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;text-decoration:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.fin-tab i{font-size:.85rem;opacity:.8}
.fin-tab:hover{color:var(--primary);background:var(--gray-50)}
.fin-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
</style>
