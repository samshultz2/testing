{% extends "base.html" %}
{% block title %}Attendance - {{ app_name }}{% endblock %}
{% block breadcrumb %}<span>Attendance</span>{% endblock %}

{% block extra_css %}
<style>
/* ---- attendance SPA (scoped .att-*) ---- */
#attendance-spa { font-size: 15px; }
.att-spinner { width: 18px; height: 18px; border: 3px solid var(--gray-200, #e5e7eb);
  border-top-color: var(--primary, #2563eb); border-radius: 50%; animation: att-spin .7s linear infinite; }
@keyframes att-spin { to { transform: rotate(360deg); } }
.att-x { background: none; border: none; font-size: 18px; line-height: 1; cursor: pointer; color: inherit; opacity: .6; }
.att-x:hover { opacity: 1; }

.att-tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  border-bottom: 1px solid var(--border-color); padding-bottom: 0; }
.att-tab { display: inline-flex; align-items: center; gap: 6px; padding: .55rem .9rem;
  text-decoration: none; color: var(--text-secondary); border-bottom: 2px solid transparent;
  border-radius: var(--radius-md) var(--radius-md) 0 0; font-weight: 600; font-size: 14px; }
.att-tab:hover { background: var(--gray-50); }
.att-tab.is-active { color: var(--primary); border-bottom-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 8%, var(--bg-card)); }
.att-tabs-status { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.att-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.att-list li { border: 1px solid var(--gray-200, #e5e7eb); border-radius: 12px; background: var(--bg-card);
  transition: border-color .15s, box-shadow .15s, background .15s; }
.att-list li:hover { border-color: var(--gray-300, #cbd5e1); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.att-list label { display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; margin: 0; }
.att-list li.is-present { border-color: color-mix(in srgb, var(--success) 45%, var(--border-color));
  background: color-mix(in srgb, var(--success) 7%, var(--bg-card)); }
.att-list li.is-absent { border-color: color-mix(in srgb, var(--danger) 38%, var(--border-color));
  background: color-mix(in srgb, var(--danger) 6%, var(--bg-card)); }
.att-list input[type=checkbox] { width: 22px; height: 22px; flex: none; accent-color: var(--success); cursor: pointer; }
.att-av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #fff; background: var(--gray-400); letter-spacing: .5px; }
.att-av[data-g="Male"] { background: #3b82f6; }
.att-av[data-g="Female"] { background: #f43f5e; }
.att-name { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; font-weight: 600; }
.att-sub { font-size: 12px; color: var(--text-muted, #6b7280); font-weight: 400; }
.att-flag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.att-list li.is-present .att-flag { color: var(--success); background: color-mix(in srgb, var(--success) 15%, var(--bg-card)); }
.att-list li.is-absent .att-flag { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--bg-card)); }

.att-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
/* On phones the register can be long — float the actions (incl. Save) as a
   sticky bar so marking never requires scrolling to the bottom to save. */
@media (max-width: 640px) {
  .att-actions { position: sticky; bottom: 8px; z-index: 5; background: var(--bg-card);
    border: 1px solid var(--border-color); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); padding: 10px; }
}

.att-grid-wrap { overflow-x: auto; border: 1px solid var(--gray-200, #e5e7eb); border-radius: 8px; }
.att-grid { border-collapse: collapse; width: 100%; min-width: 100%; font-size: 14px; }
.att-grid th, .att-grid td { border: 1px solid var(--gray-100, #f1f5f9); padding: 6px 8px; text-align: center; }
.att-grid thead th { background: var(--gray-50, #f8fafc); position: sticky; top: 0; white-space: nowrap; }
.att-grid .att-grid-name { text-align: left; white-space: nowrap; position: sticky; left: 0;
  background: var(--bg-card); z-index: 1; font-weight: 600; }
.att-grid input[type=checkbox] { width: 18px; height: 18px; }
/* Narrow summary tables (gender / session) never scroll horizontally, so the
   sticky first column is unneeded — and on Android Chrome a sticky cell in a
   width:100% table collapses it to content width, leaving a blank strip on the
   right. Fixed layout + a static first column makes them fill the card. */
.att-grid--summary { table-layout: fixed; }
.att-grid--summary .att-grid-name { position: static; background: transparent; width: 38%; }
.att-ampm { display: inline-flex; gap: 8px; }
.att-ampm label { display: inline-flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-muted, #6b7280); gap: 2px; cursor: pointer; }

/* ---- report stat cards / info grids / performance bands ---- */
.att-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
@media (min-width: 768px) { .att-stats { grid-template-columns: repeat(4, 1fr); } }
.att-stat { background: var(--bg-card); border: 1px solid var(--gray-200, #e5e7eb); border-radius: 10px; padding: 14px; text-align: center; }
.att-stat.is-primary { background: var(--primary, #2563eb); color: #fff; border: none; }
.att-stat-value { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
.att-stat-label { font-size: 12px; opacity: .85; margin-top: 4px; }

.att-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
@media (min-width: 576px) { .att-info { grid-template-columns: repeat(3, 1fr); } }
.att-info-item { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--gray-50, #f8fafc); border-radius: 6px; }
.att-info-item .k { color: var(--text-muted, #6b7280); font-size: 13px; }
.att-info-item .v { font-weight: 600; }

.att-section-title { font-weight: 700; font-size: 15px; margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; color: var(--text-primary, #111827); }

.att-perf { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 576px) { .att-perf { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 992px) { .att-perf { grid-template-columns: repeat(4, 1fr); } }
.att-perf-card { padding: 12px; border-radius: 8px; border-left: 4px solid; }
.att-perf-card .t { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.att-perf-card .c { font-size: 1.5rem; font-weight: 700; }
.att-perf-card .r { font-size: 12px; color: var(--text-muted, #6b7280); }

.att-mark { display: inline-flex; gap: 3px; font-size: 13px; }
.att-mark .ok { color: var(--success); }
.att-mark .no { color: var(--danger); }
.att-grid tfoot td { font-weight: 700; background: var(--gray-50, #f8fafc); }
.att-sub { color: var(--text-muted, #6b7280); font-size: 11px; font-weight: 400; }
.att-legend { font-size: 12px; color: var(--text-muted, #6b7280); margin-top: 10px; }
.att-linkbtn { background: none; border: none; padding: 0; margin: 0; cursor: pointer; color: inherit;
  font: inherit; text-align: inherit; text-decoration: underline dotted; text-underline-offset: 2px; }
.att-linkbtn:hover { color: var(--primary, #2563eb); }

@media (max-width: 560px) {
  /* Keep the label beside every icon (icons alone are ambiguous); just tighten
     spacing and let the tabs wrap onto multiple rows on small screens. */
  .att-tab { padding: .5rem .6rem; font-size: 13px; gap: 5px; }
}

/* ---- student attendance profile ---- */
.att-profile-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 8px 0 4px; }
.att-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
  background: color-mix(in srgb, var(--primary) 16%, var(--bg-card)); color: var(--primary);
  display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; }
.att-sub { font-size: 12px; color: var(--text-muted, #6b7280); }
.att-warn { background: color-mix(in srgb, var(--danger) 9%, var(--bg-card)); border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--bg-card)); color: var(--text-primary);
  border-radius: var(--radius-md); padding: 10px 12px; margin: 10px 0; font-size: 14px; }
.att-warn i { color: var(--danger); margin-right: 6px; }
.att-trend { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding: 8px 4px 0;
  border-bottom: 1px solid var(--gray-200, #e5e7eb); }
.att-trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.att-trend-bar { width: 70%; max-width: 44px; border-radius: 4px 4px 0 0; min-height: 4px; }
.att-trend-lbl { font-size: 10px; color: var(--text-muted, #6b7280); margin-top: 4px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.att-cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted, #6b7280); margin: 4px 0 10px; }
.att-cal-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.att-cal-months { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 620px) { .att-cal-months { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 992px) { .att-cal-months { grid-template-columns: repeat(3, 1fr); } }
.att-cal { border: 1px solid var(--gray-200, #e5e7eb); border-radius: 8px; padding: 8px; }
.att-cal-title { font-weight: 600; font-size: 13px; margin-bottom: 6px; text-align: center; }
.att-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.att-cal-h { font-size: 10px; color: var(--text-muted, #6b7280); text-align: center; }
.att-cal-c { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 11px;
  border-radius: 4px; background: var(--gray-50, #f8fafc); }
.att-cal-empty { background: transparent; }
.att-cal-off { color: var(--gray-300, #cbd5e1); }

/* ---- absent-today list + WhatsApp share (daily summary) ---- */
.att-absentees { margin: 18px 0; }
.att-wa-btn { background: #25D366; color: #fff; border-color: #25D366; }
.att-wa-btn:hover { background: #1da851; border-color: #1da851; color: #fff; }
.att-wa-ic { color: #25D366; font-size: 16px; }

@media print {
  .att-tabs, .no-print, .att-tabs-status, .ax-head, .ax-chips, .ax-rail, .md-bar { display: none !important; }
  .ax-cols { display: block !important; }
  .ax-panel { border: 0 !important; padding: 0 !important; }
}
/* ══ Attendance app shell — laptop workspace / phone app ══ */
.ax{max-width:1360px;margin:0 auto}
.ax-head{display:flex;align-items:center;gap:.9rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:.85rem 1.1rem;margin-bottom:.9rem}
.ax-logo{width:44px;height:44px;border-radius:13px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;font-size:1.1rem}
.ax-title{flex:1;min-width:0}
.ax-kicker{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.ax-title h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:-.015em}
.ax-head-acts{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.ax-term{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--border-color);border-radius:11px;height:38px;padding:0 .3rem 0 .7rem;background:var(--bg-card);margin:0}
.ax-term i{color:var(--primary);font-size:.85rem}
.ax-term select{border:0;background:transparent;font:inherit;font-weight:600;font-size:.88rem;color:var(--text-primary);height:100%;max-width:240px;cursor:pointer}
.ax-net{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;font-weight:700;border-radius:999px;padding:.3rem .7rem}
.ax-net.on{background:color-mix(in srgb,var(--success) 13%,var(--bg-card));color:var(--success)}
.ax-net.off{background:color-mix(in srgb,var(--danger) 12%,var(--bg-card));color:var(--danger)}
.ax-chips{display:none}
.ax-cols{display:grid;grid-template-columns:240px minmax(0,1fr);gap:1rem;align-items:start}
.ax-rail{position:sticky;top:calc(var(--header-height,60px) + 12px);background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:.5rem}
.ax-group{padding:.2rem 0 .4rem}
.ax-group+.ax-group{border-top:1px solid var(--border-light);padding-top:.5rem}
.ax-group-h{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);padding:.25rem .6rem .3rem}
.ax-rail a{display:flex;align-items:center;gap:.65rem;padding:.5rem .55rem;border-radius:11px;color:inherit;text-decoration:none}
.ax-rail a:hover{background:var(--gray-50)}
.ax-rail a.on{background:color-mix(in srgb,var(--primary) 10%,var(--bg-card))}
.ax-rail a.on strong{color:var(--primary)}
.ax-ic{width:30px;height:30px;border-radius:9px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--gray-100);color:var(--text-secondary);font-size:.8rem}
.ax-rail a.on .ax-ic{background:var(--primary);color:#fff}
.ax-lb{display:flex;flex-direction:column;min-width:0}
.ax-lb strong{font-size:.87rem}
.ax-lb small{font-size:.7rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ax-rail .ax-classic{font-size:.8rem;color:var(--text-muted);border-top:1px solid var(--border-light);border-radius:0;margin-top:.3rem;padding:.65rem .6rem .35rem}
.ax-panel{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:1rem 1.1rem}
.ax-panel.bare{background:none;border:0;padding:0}
@media (max-width:1023px){.ax-cols{grid-template-columns:200px minmax(0,1fr)}.ax-lb small{display:none}}
@media (max-width:759px){
  .ax-head{padding:.75rem .85rem;gap:.7rem;border-radius:18px;flex-wrap:wrap}
  .ax-logo{width:40px;height:40px}
  .ax-title h1{font-size:1.15rem}
  .ax-head-acts{width:100%;justify-content:space-between;flex-wrap:nowrap}
  .ax-term{flex:1;min-width:0}.ax-term select{max-width:none;width:100%}
  .ax-chips{display:flex;gap:.4rem;overflow-x:auto;position:sticky;top:var(--header-height,60px);z-index:40;margin:0 -12px .8rem;padding:.45rem 12px;
    background:color-mix(in srgb,var(--bg-body) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);scrollbar-width:none}
  .ax-chips::-webkit-scrollbar{display:none}
  .ax-chips a{flex:none;display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-secondary);
    font-weight:600;font-size:.84rem;padding:.48rem .85rem;border-radius:999px;text-decoration:none}
  .ax-chips a i{font-size:.78rem;opacity:.8}
  .ax-chips a.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .ax-chips a.on i{opacity:1}
  .ax-cols{display:block}
  .ax-rail{display:none}
  .ax-panel{border-radius:18px;padding:.85rem}
}


/* ---- analytics dashboard ---- */
.att-inline-field { font-size: 13px; color: var(--text-muted, #6b7280); }
.att-bars { display: flex; flex-direction: column; gap: 6px; }
.att-bar-row { display: grid; grid-template-columns: minmax(90px, 30%) 1fr 46px; gap: 8px; align-items: center; }
.att-bar-lbl { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att-bar-track { background: var(--gray-100, #f1f5f9); border-radius: 6px; height: 16px; overflow: hidden; }
.att-bar-fill { height: 100%; border-radius: 6px; min-width: 2px; }
.att-bar-val { font-size: 13px; font-weight: 600; text-align: right; }
.att-heat { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.att-heat-cell { border-radius: 8px; padding: 12px 4px; text-align: center; background: var(--gray-100, #f1f5f9); }
.att-heat-day { font-size: 12px; font-weight: 600; }
.att-heat-pct { font-size: 15px; font-weight: 700; margin-top: 2px; }

/* ---- interventions ---- */
.iv-case { border: 1px solid var(--gray-200, #e5e7eb); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
.iv-case-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.iv-case-metrics { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.iv-notes { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.iv-notes li { margin-bottom: 3px; }
.iv-case-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.iv-noteform { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
.iv-noteform .form-control { flex: 1; min-width: 140px; }

/* ---- recent-class quick pick ---- */
.att-recent { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: -4px 0 10px; }
.att-chip { border: 1px solid var(--gray-200, #e5e7eb); background: var(--bg-card); border-radius: 999px;
  padding: 3px 12px; font-size: 12px; cursor: pointer; color: var(--text-primary, #111827); }
.att-chip:hover { border-color: var(--primary, #2563eb); }
.att-chip.is-active { background: var(--primary, #2563eb); color: #fff; border-color: var(--primary, #2563eb); }

/* ── Mark daily: native-style register ── */
.md{display:flex;flex-direction:column;gap:.9rem}
.md-pick,.md-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:16px;padding:.9rem 1rem}
.md-pick{display:flex;flex-direction:column;gap:.7rem}
.md-pick-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.md-pick-l{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.md-select{height:34px;border:1px solid var(--border-color);border-radius:9px;background:var(--bg-card);color:var(--text-primary);font:inherit;font-size:.85rem;padding:0 .5rem;max-width:220px}
.md-classes{display:flex;flex-wrap:wrap;gap:.45rem}
.md-classes button{border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-secondary);font:inherit;font-weight:600;font-size:.88rem;
  padding:.5rem .9rem;border-radius:11px;cursor:pointer;white-space:nowrap}
.md-classes button:hover{border-color:var(--primary)}
.md-classes button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.md-none{margin:0;color:var(--text-muted)}
.md-date{display:flex;align-items:center;gap:.4rem}
.md-step{width:40px;height:40px;border-radius:11px;border:1px solid var(--border-color);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;flex:none}
.md-step:hover{border-color:var(--primary);color:var(--primary)}
.md-date-box{position:relative;display:inline-flex;align-items:center;gap:.55rem;height:40px;padding:0 .9rem;border:1px solid var(--border-color);border-radius:11px;
  font-weight:700;font-size:.92rem;margin:0;cursor:pointer;background:var(--bg-card);min-width:170px}
.md-date-box i{color:var(--primary)}
.md-date-box input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.md-today{border:0;background:color-mix(in srgb,var(--primary) 10%,var(--bg-card));color:var(--primary);font:inherit;font-weight:700;font-size:.84rem;padding:.5rem .8rem;border-radius:10px;cursor:pointer}
.md-sum{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;padding-bottom:.85rem;margin-bottom:.75rem;border-bottom:1px solid var(--border-light)}
.md-sum-t{display:flex;flex-direction:column;flex:1;min-width:180px}
.md-sum-t strong{font-size:1.2rem;font-weight:800}
.md-sum-t>span{font-size:.84rem;color:var(--text-muted)}
.md-pills{display:flex;gap:.35rem;margin-top:.3rem}
.md-meters{display:flex;flex-direction:column;gap:.4rem;flex:0 1 320px;min-width:220px}
.md-meter{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:.5rem;font-size:.8rem}
.md-meter span{color:var(--text-muted);font-weight:600}
.md-meter b{text-align:right;font-variant-numeric:tabular-nums}
.md-track{height:8px;border-radius:5px;background:color-mix(in srgb,var(--danger) 22%,var(--gray-200));overflow:hidden}
.md-track i{display:block;height:100%;background:var(--success);border-radius:5px;transition:width .2s}
.md-note{font-size:.84rem;color:var(--text-muted);margin:0 0 .6rem;padding:.55rem .7rem;border-radius:10px;background:var(--gray-50)}
.md-note.abs{color:var(--text-primary);background:color-mix(in srgb,var(--danger) 8%,var(--bg-card))}
.md-note.abs i{color:var(--danger)}
.md-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:1.2rem}
.md-ghead{grid-column:1/-1;display:flex;align-items:center;gap:.5rem;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-secondary);padding:.65rem .2rem .35rem;border-bottom:2px solid var(--border-color)}
.md-ghead span{margin-left:auto;font-size:.72rem;background:var(--gray-100);border-radius:999px;padding:0 .5rem;letter-spacing:0}

.iv2-h{display:flex;align-items:center;gap:.6rem}
.iv2-h .att-av{width:38px;height:38px;font-size:12px;background:var(--primary)}
.iv2-t{flex:1;min-width:0;display:flex;flex-direction:column}
.iv2-t a{color:inherit;text-decoration:none}.iv2-t a:hover{color:var(--primary)}
.iv2-t small{font-size:.74rem;color:var(--text-muted)}
.iv2-m{display:flex;align-items:center;gap:.8rem;background:var(--gray-50);border-radius:12px;padding:.55rem .8rem}
.iv2-m>div{display:flex;flex-direction:column}
.iv2-m span{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.iv2-m b{font-size:1.05rem}
.iv2-m>i{color:var(--text-muted);font-size:.8rem}
.iv2-d{margin-left:auto;font-weight:800;font-size:.86rem;color:var(--text-muted)}
.iv2-d.good{color:var(--success)}.iv2-d.bad{color:var(--danger)}
.iv2-r{margin:0;font-size:.84rem;color:var(--text-secondary)}
.iv2-tl{list-style:none;margin:0;padding:0 0 0 .9rem;border-left:2px solid var(--border-color);display:flex;flex-direction:column;gap:.45rem;font-size:.84rem}
.iv2-tl li{position:relative}
.iv2-tl li::before{content:'';position:absolute;left:-1.26rem;top:.35rem;width:9px;height:9px;border-radius:50%;background:var(--primary)}
.iv2-a{display:flex;gap:.4rem;flex-wrap:wrap}
.ak-form{display:flex;flex-direction:column;gap:.35rem}
.ak-kinds{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.4rem}
.ak-kinds button{border:1px solid var(--border-color);background:var(--bg-card);font:inherit;font-size:.84rem;font-weight:600;padding:.4rem .75rem;border-radius:999px;cursor:pointer;color:var(--text-secondary)}
.ak-kinds button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.ak-two{display:grid;grid-template-columns:1.4fr 1fr;gap:.6rem;margin-top:.3rem}
.ak-go{height:46px;border-radius:12px;font-weight:700;margin-top:.6rem}
.ak-notify{display:inline-flex;gap:.35rem}
.ak-notify select{height:36px;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-card);color:var(--text-primary);font:inherit;font-size:.82rem;padding:0 .4rem}
/* student profile */
.ak-search{position:relative;z-index:6}
.sp2-av{width:64px;height:64px;border-radius:50%;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;color:var(--primary);background:color-mix(in srgb,var(--primary) 13%,var(--bg-card))}
.sp2.warn{border-color:color-mix(in srgb,var(--danger) 35%,var(--border-color))}
.sp2-acts{display:flex;flex-direction:column;gap:.4rem}
.sp2-iv{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.att-trend-col{position:relative}
.att-trend-v{font-size:.66rem;font-weight:700;color:var(--text-muted);margin-bottom:2px}
/* sheet */
.ak-sheet-bg{position:fixed;inset:0;z-index:2000;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:1rem}
.ak-sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--bg-card);border-radius:18px;padding:1rem 1.2rem 1.2rem;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.ak-grip{display:none}
.ak-sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem;font-size:1.05rem}
.ak-x{border:0;background:var(--gray-100);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--text-secondary)}
@media (max-width:1099px){.ak-cols,.ak-grid2{grid-template-columns:minmax(0,1fr)}.ak-grid2>span:empty{display:none}}
@media (max-width:759px){
  .ak-tiles{display:flex;overflow-x:auto;margin:0 -12px;padding:0 12px 2px;scrollbar-width:none}
  .ak-tiles::-webkit-scrollbar{display:none}
  .ak-tile{flex:0 0 auto;min-width:122px;max-width:170px}
  .ak-card{border-radius:18px}
  .ak-card-h{padding:.75rem .85rem}
  .ak-card-a .ak-btn span,.ak-hero .ak-btn span,.ak-toolbar-r .ak-btn span{display:none}
  .ak-card-a .ak-btn,.ak-hero .ak-btn{width:38px;justify-content:center;padding:0}
  .ak-card-a .ak-seg{width:100%}
  .ak-card-a{width:100%}
  .ak-hero{border-radius:18px;padding:.9rem;gap:.8rem}
  .ak-hero .ak-ring{width:84px!important;height:84px!important}
  .ak-hero-t{min-width:0;flex-basis:calc(100% - 100px)}
  .ak-meter{grid-template-columns:70px 1fr 54px}
  .ak-bands{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ak-week{gap:.35rem}
  .ak-wday{padding:.45rem .1rem;border-radius:12px}
  .tr-bar{flex-basis:56px}
  .ak-pname small{white-space:normal}
  .ak-pright .ak-btn span{display:none}
  .ak-pright .tr-bar{display:none}
  .ak-pick-row2{flex-direction:column;align-items:stretch}
  .ak-pick-row2 .ak-seg{align-self:flex-start}
  .wg-row{gap:.25rem}
  .wg-name small{display:none}
  .wg-who .att-av{display:none}
  .wg-cell{height:38px;border-radius:9px}
  .wr-row{display:flex!important;flex-wrap:wrap;gap:.35rem .3rem}
  .wr-who{flex:1 0 calc(100% - 70px);order:0}
  .wr-tot{flex:0 0 60px;order:1}
  .wr-row.wr-head{display:none!important}
  .wr-pair{order:2;flex:1 0 15%;min-width:0;flex-direction:column!important;align-items:center;background:var(--gray-50);border-radius:9px;padding:.25rem 0;gap:2px!important}
  .wr-pair::before{content:attr(data-d);font-size:.6rem;font-weight:800;text-transform:uppercase;color:var(--text-muted)}
  .wr-pair .ak-dot{width:100%;max-width:30px;height:18px}
  .wr-foot .c:not(:last-child){display:none!important}
  .wr-foot{justify-content:space-between}
  .iv2-list{grid-template-columns:minmax(0,1fr)}
  .ak-two{grid-template-columns:minmax(0,1fr)}
  .ak-sheet-bg{align-items:flex-end;padding:0}
  .ak-sheet{max-width:none;border-radius:22px 22px 0 0;padding:.4rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
  .ak-grip{display:block;width:38px;height:5px;border-radius:3px;background:var(--border-color);margin:.3rem auto .7rem}
  .sp2-acts{flex-direction:row;width:100%}
  .sp2-acts .ak-btn{flex:1;justify-content:center}
  .sp2-acts .ak-btn span{display:inline}
  .ak-thr button{flex:1}
}
@media print{.ak-tiles{display:grid!important}.md-bar,.ak-toolbar-r,.sp2-acts{display:none!important}}
</style>
{% endblock %}

{% block content %}
<div id="attendance-spa" class="ax"><div class="att-spinner" aria-label="Loading"></div></div>
<script src="{{ bundle_url('js/react/attendance-app.js') }}" defer></script>
{% endblock %}
