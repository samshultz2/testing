{% extends "base.html" %}

{% block title %}Add Student - {{ app_name }}{% endblock %}

{% block breadcrumb %}
<span>Students</span> / <span>Add Student</span>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1><i class="fas fa-user-plus"></i> Add New Student</h1>
</div>

<form method="POST" action="{{ url_for('main.add_student') }}">
    <div class="card mb-3">
        <div class="card-header"><h3><i class="fas fa-user"></i> Personal Information</h3></div>
        <div class="card-body">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Surname <span class="text-danger">*</span></label>
                    <input type="text" name="surname" class="form-control" required placeholder="Surname">
                </div>
                <div class="form-group">
                    <label class="form-label">First Name <span class="text-danger">*</span></label>
                    <input type="text" name="first_name" class="form-control" required placeholder="First name">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Middle Name</label>
                <input type="text" name="middle_name" class="form-control" placeholder="Middle name (optional)">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Gender <span class="text-danger">*</span></label>
                    <select name="gender" class="form-control" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="date_of_birth" class="form-control">
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Religion</label>
                <select name="religion" class="form-control">
                    <option value="">Select Religion</option>
                    {% for r in religions %}
                    <option value="{{ r }}">{{ r }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Home Address</label>
                <textarea name="home_address" class="form-control" rows="3" placeholder="Full address"></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">Hobbies</label>
                <input type="text" name="hobbies" class="form-control" placeholder="e.g., Football, Reading">
                <small class="text-muted">Separate with commas</small>
            </div>
        </div>
    </div>
    
    <div class="card mb-3">
        <div class="card-header">
            <h3><i class="fas fa-phone"></i> Parent/Guardian Contacts</h3>
        </div>
        <div class="card-body">
            <div id="contactsContainer">
                <div class="contact-row">
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" name="contact_name[]" class="form-control" placeholder="e.g., Mr. John">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone <span class="text-danger">*</span></label>
                        <input type="tel" name="phone_number[]" class="form-control" required placeholder="08012345678">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Relationship</label>
                        <select name="relationship[]" class="form-control">
                            <option value="Father">Father</option>
                            <option value="Mother">Mother</option>
                            <option value="Guardian">Guardian</option>
                            <option value="Sibling">Sibling</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <button type="button" id="addContactBtn" class="btn btn-secondary btn-sm mt-2">
                <i class="fas fa-plus"></i> Add Another Contact
            </button>
        </div>
    </div>
    
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-lg">
            <i class="fas fa-save"></i> Save Student
        </button>
        <a href="{{ url_for('main.students_list') }}" class="btn btn-secondary btn-lg">
            Cancel
        </a>
    </div>
</form>

<style>
.contact-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
    padding: 1rem;
    background: var(--gray-50);
    border-radius: var(--radius-md);
    margin-bottom: 0.75rem;
    position: relative;
}
@media (min-width: 768px) {
    .contact-row {
        grid-template-columns: 1fr 1fr 1fr auto;
        align-items: end;
    }
}
.contact-row .form-group { margin-bottom: 0; }
.contact-row .remove-contact-btn {
    align-self: end;
}
.form-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
}
@media (min-width: 576px) {
    .form-row { grid-template-columns: repeat(2, 1fr); }
}
.form-row .form-group { margin-bottom: 0; }
</style>
{% endblock %}
