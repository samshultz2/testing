<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} — {{ title }}</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
               background:linear-gradient(135deg,#0d6a4e,#064e36); color:#fff; padding:1.5rem; text-align:center; }
        .box { max-width:420px; }
        .code { font-size:4rem; font-weight:800; line-height:1; margin-bottom:.25rem; }
        h1 { font-size:1.3rem; margin:.25rem 0; }
        p { opacity:.9; line-height:1.5; }
        .actions { margin-top:1.25rem; display:flex; gap:.5rem; justify-content:center; flex-wrap:wrap; }
        a { padding:.6rem 1.3rem; border-radius:8px; font-weight:600; text-decoration:none; }
        .primary { background:var(--bg-card); color:#0d6a4e; }
        .ghost { border:1px solid rgba(255,255,255,.6); color:#fff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">{{ code }}</div>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <div class="actions">
            <a class="primary" href="/">Go to Dashboard</a>
            <a class="ghost" href="javascript:history.back()">Go Back</a>
        </div>
    </div>
</body>
</html>
