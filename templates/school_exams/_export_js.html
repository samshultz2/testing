<script nonce="{{ csp_nonce }}">
/* JSS3 / Basic exam export — same flow as the WAEC / NECO export: every
   format is the server's branded results document. */
var sxExport = {
  year: {{ year|tojson }},
  stem: {{ (level ~ '_' ~ body ~ '_' ~ year)|tojson }},
  url: {{ url_for(bp ~ '.export', body=body)|tojson }}
};
function sxOpenExport() {
  var m = document.getElementById('sxExportModal');
  if (m.parentNode !== document.body) document.body.appendChild(m);   // above sticky headers
  m.style.display = 'block';
}
function sxCloseExport() { document.getElementById('sxExportModal').style.display = 'none'; }
function sxToggleExport() {
  var t = document.querySelector('input[name="sxType"]:checked').value;
  document.getElementById('sxExpStudents').style.display = t === 'students' ? 'block' : 'none';
  document.getElementById('sxExpSubjects').style.display = t === 'subjects' ? 'block' : 'none';
}
document.getElementById('sxExportModal').addEventListener('click', function (e) { if (e.target === this) sxCloseExport(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') sxCloseExport(); });

function sxCols(type) {
  return Array.prototype.map.call(
    document.querySelectorAll('input[data-sx-col="' + type + '"]:checked'), function (el) { return el.value; });
}
function sxSaveBlob(blob, name) {
  var u = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
}
function sxDownloadImages(url) {
  var page = 1, total = 1;
  function next() {
    return fetch(url + '&page=' + page, { credentials: 'same-origin' }).then(function (res) {
      if (!res.ok) return;
      total = parseInt(res.headers.get('X-Total-Pages') || '1', 10) || 1;
      return res.blob().then(function (blob) {
        sxSaveBlob(blob, sxExport.stem + (url.indexOf('type=subjects') !== -1 ? '_subjects' : '') + (total > 1 ? ('_p' + page) : '') + '.png');
        page += 1;
        if (page <= total) return next();
      });
    });
  }
  return next();
}

function sxGenerateExport() {
  var type = document.querySelector('input[name="sxType"]:checked').value;
  var format = document.querySelector('input[name="sxFormat"]:checked').value;
  var p = new URLSearchParams();
  p.set('year', sxExport.year); p.set('format', format); p.set('type', type);
  p.set('cols', sxCols(type).join(','));
  var sz = document.querySelector('input[name="sxSize"]:checked');
  p.set('size', sz ? sz.value : 'm');
  var url = sxExport.url + '?' + p.toString();
  sxCloseExport();
  if (format === 'image') sxDownloadImages(url); else window.location.href = url;
}
</script>
